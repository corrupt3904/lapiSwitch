# TB522FU device information. The folder name must equal model.

model = "TB522FU"
# Codename that may appear instead of the model name over ADB/EDL.
codename = "mojito"
# true: DeviceInfo can be dumped. This runs the backup, TWRP and restore flow, so [firmware], [installed], [twrp] and [country] are required.
deviceinfo_read = true
# true: DeviceInfo can be written (firmware flashing and DeviceInfo editing). Requires deviceinfo.toml.
# Dump only until its writes are validated.
deviceinfo_write = false

# Official firmware folder check.
[firmware]
loader = "xbl_s_devprg_ns.melf"
required_images = ["vbmeta_system.img", "vendor_boot.img", "boot.img", "vbmeta.img"]
# The region is read from the build_region property of the product_region node in the vendor_boot DTB.
region_marker = "product_region/build_region"

# Accepted range of the firmware installed on the device.
# build_date: the YYMMDD date and region letter (C=PRC, W=ROW) at the end of the build number; accepted up to the max date.
[installed]
scheme = "build_date"

[[installed.allow]]
region = "PRC"
suffix = "C"
max = "2026-09-24"
label = "2026-09-24 (10.028.260924C)"

[[installed.allow]]
region = "ROW"
suffix = "W"
max = "2026-09-04"
label = "2026-09-04 (11.055.260904W)"

# Official TWRP release to use. Its size and SHA-256 are checked on every use.
[twrp]
tag = "TWRP-3.7.1_16"
name = "TWRP-3.7.1_16-TB522FU-landscape.img"
size = 104857600
sha256 = "9734a068dbff736e92e2ad1d3aefd96d3ee8e4dcedaf56b5b134dcafbe43f77b"
url = "https://github.com/lanweikayu/android_device_lenovo_TB522FU/releases/download/TWRP-3.7.1_16/TWRP-3.7.1_16-TB522FU-landscape.img"

# Country code: only the 32-byte field at 0xE4 of the oemowninfo partition (LUN 0, 1 MiB) is changed.
# The original partition is backed up before any work.
[country]
method = "oemowninfo"
partition = "oemowninfo"
lun = 0
size = 0x100000
offset = 0xE4
field_size = 0x20
