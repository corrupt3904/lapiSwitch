# TB522FU DeviceInfo field map.
#
# The fields must cover 0..logical_size without gaps or overlaps; this is checked at build time.
# kind:  flag (1 byte, 0/1) · uint (little-endian, 1/2/4/8 bytes) · region (PRC/ROW, 16 bytes)
#        text (ASCII, NUL padded) · text_nul (ASCII, the last byte stays NUL) · bytes (hex)
# class: basic · advanced · protected (security/structure fields: changing them in the custom tab needs a risk confirmation)
# count/stride: a repeated field. {n} in key becomes 0..count-1 and offset grows by stride.
# Required fields: magic, is_unlocked, is_unlock_critical, region, rollback_index[0..31]

logical_size = 0x0D20
persistent_help = "Storage where AVB remembers state between boots: 8 name/value records.\nFor example, avb.managed_verity_mode is stored here.\nAVB can change the contents during boot.\nEmpty records do not mean AVB is off.\nThis is a different area from the persist.img partition.\n(Confirmed)"
rollback_help = "AVB anti-rollback reference values: 32 entries, each a 64-bit integer.\nThe number is the AVB rollback_index_location, not an A/B slot.\nAn image whose rollback index is lower than this value gives a rollback error, and whether boot actually stops also depends on the lock state.\nThe bootloader can raise and store the value during boot.\nEven if it looks like a date, it is a security reference value, not a release date.\n(Confirmed)"

[[field]]
key = "magic"
offset = 0x0000
size = 0x0D
kind = "text"
class = "protected"
description = "DeviceInfo magic"
help = "DeviceInfo format identifier: the 13 bytes ANDROID-BOOT!.\nIf it differs at boot, the bootloader clears the whole DeviceInfo to 0 and rebuilds the defaults, which also loses the public key, rollback indices, AVB persistent values and region.\nIt is not a signature or checksum, so a matching value does not mean the rest is valid.\n(Confirmed)"
editable = false

[[field]]
key = "is_unlocked"
offset = 0x000D
size = 1
kind = "uint"
class = "protected"
description = "Bootloader unlock state"
help = "0 = bootloader locked\n1 = bootloader unlocked\n\nGeneral bootloader lock state.\nAVB uses it to decide whether verification errors are allowed, and it is tied to the Fastboot lock display and to flashing and erase limits, so it is a real security decision value.\nThe official lock change also updates the security state and requests a data wipe, which is not the same as changing only this byte.\n(Confirmed)"
choices = ["0", "1"]

[[field]]
key = "is_unlock_critical"
offset = 0x000E
size = 1
kind = "uint"
class = "protected"
description = "Critical unlock state"
help = "0 = extra lock kept\n1 = unlocked\n\nExtra lock state for critical partitions.\nWith 0, flashing and erasing partitions classed as critical are refused.\nEven with is_unlocked = 1, the critical partition limit stays while this is 0.\n(Confirmed)"
choices = ["0", "1"]

[[field]]
key = "charger_screen_enabled"
offset = 0x000F
size = 1
kind = "flag"
class = "basic"
description = "Charger screen enabled"
help = "0 = disabled\n1 = enabled\n\nStored off-mode charging policy (off-mode-charge) for when a charger is connected while the tablet is off.\nEntering the charging screen also depends on charger detection and other boot requests.\nIt does not show whether the tablet is charging now.\n(Confirmed)"
choices = ["0", "1"]

[[field]]
key = "bootloader_version"
offset = 0x0010
size = 0x40
kind = "text_nul"
class = "advanced"
description = "Bootloader version string"
help = "Bootloader version string shown by Fastboot version-bootloader.\nChanging it does not change the actual bootloader code or security patch level.\nIt is used as a string, so it must keep a terminating 0 byte at the end.\n(Confirmed)"

[[field]]
key = "radio_version"
offset = 0x0050
size = 0x40
kind = "text_nul"
class = "advanced"
description = "Radio/baseband version string"
help = "Radio/baseband version string shown by Fastboot version-baseband.\nChanging it does not change the actual modem firmware.\n(Confirmed)"

[[field]]
key = "verity_mode"
offset = 0x0090
size = 1
kind = "uint"
class = "protected"
description = "Verity mode"
help = "0 = logging\n1 = enforcing\n\nBootloader verity state.\nOn the AVB2 path a value of 0 adds the \"restarted due to hashtree corruption\" flag.\nThe final error handling (restart or EIO) is set together by the AVB persistent value avb.managed_verity_mode and the image settings.\n2 or more is not a valid mode and makes the bootloader read past its table (boot color strings).\n(Confirmed)"
choices = ["0", "1"]

[[field]]
key = "reserved_0091"
offset = 0x0091
size = 3
kind = "bytes"
class = "advanced"
description = "Alignment/reserved"
help = "The 3 bytes after verity_mode, most likely space that aligns the next 4-byte integer.\nNo function of its own has been found.\nThere is no evidence that it is unused and free to change.\n(Unconfirmed)"

[[field]]
key = "user_public_key_length"
offset = 0x0094
size = 4
kind = "uint"
class = "protected"
description = "User public key length"
help = "Number of valid bytes in the user AVB public key below (at most 2048).\n0 means no user key is registered; the manufacturer's built-in keys stay.\nIt is not an RSA bit size or an algorithm number.\nA length that does not match the contents can break the public key trust decision.\n(Confirmed)"

[[field]]
key = "user_public_key"
offset = 0x0098
size = 0x800
kind = "bytes"
class = "protected"
description = "User public key"
help = "User-registered AVB public key.\nThe bootloader compares the image's public key with it, length and contents, to decide whether to trust it; if they differ it compares with the manufacturer's built-in keys.\nChanging it affects the AVB trust decision.\nIt is not a private key, so it cannot make signatures on its own.\n(Confirmed. On TB522FU the registration command path is unconfirmed.)"

[[field]]
key = "rollback_index[{n}]"
offset = 0x0898
size = 8
count = 32
stride = 8
kind = "uint"
class = "basic"
description = "Rollback index"
help = "AVB anti-rollback reference values: 32 entries, each a 64-bit integer.\nThe number is the AVB rollback_index_location, not an A/B slot.\nAn image whose rollback index is lower than this value gives a rollback error, and whether boot actually stops also depends on the lock state.\nThe bootloader can raise and store the value during boot.\nEven if it looks like a date, it is a security reference value, not a release date.\n(Confirmed)"
decimal = true
max_digits = 10

[[field]]
key = "persistent[{n}].valid"
offset = 0x0998
size = 2
count = 8
stride = 0x5E
kind = "uint"
class = "protected"
description = "AVB persistent value in use"
help = "Whether this record is in use.\nOnly exactly 1 means in use; 2 or more is treated as an empty record.\n(Confirmed)"
choices = ["0", "1"]

[[field]]
key = "persistent[{n}].name_length"
offset = 0x099A
size = 2
count = 8
stride = 0x5E
kind = "uint"
class = "protected"
description = "AVB persistent value name length"
help = "Number of bytes used to compare the name (at most 56).\n(Confirmed)"

[[field]]
key = "persistent[{n}].value_length"
offset = 0x099C
size = 2
count = 8
stride = 0x5E
kind = "uint"
class = "protected"
description = "AVB persistent value data length"
help = "Valid length of the value (at most 32).\n(Confirmed)"

[[field]]
key = "persistent[{n}].name"
offset = 0x099E
size = 0x38
count = 8
stride = 0x5E
kind = "text"
class = "protected"
description = "AVB persistent value name"
help = "Record name.\nIts range is set by the length field, so it may have no terminating 0 byte.\n(Confirmed)"

[[field]]
key = "persistent[{n}].value"
offset = 0x09D6
size = 0x20
count = 8
stride = 0x5E
kind = "bytes"
class = "protected"
description = "AVB persistent value data"
help = "Raw data for the name.\nIt cannot be read uniformly as a string or an integer.\n(Confirmed)"

[[field]]
key = "golden_snapshot"
offset = 0x0C88
size = 8
kind = "uint"
class = "advanced"
description = "Golden snapshot (presumed)"
help = "8-byte value compared with the constant 0x575757.\nIt is not a 0/1 setting, so 1 does not mean true.\nThe name comes from an outside structure, and the official name is unconfirmed.\nIn both analysed bootloaders the related display path (Erase swap on restore) is off, and no actual snapshot restore or swap erase was found.\n(Partly confirmed)"
choices = ["0x0", "0x575757"]

[[field]]
key = "audio_framework"
offset = 0x0C90
size = 0x10
kind = "text"
class = "advanced"
description = "Audio framework buffer"
help = "Audio framework name passed at boot as androidboot.audio=<name>.\nThe allowed names are audioreach, elite and awe, case-sensitive.\nAny other value is cleared to an empty string and saved during boot.\nIt is not an audio firmware version or a sound setting.\n(Confirmed)"
choices = ["audioreach", "elite", "awe"]

[[field]]
key = "fdr_frs_uds_flag"
offset = 0x0CA0
size = 1
kind = "uint"
class = "protected"
description = "FDR/FRS-UDS state"
help = "Request flag to create a new security secret after a factory data reset (FDR).\nIt is set to 1 when a specific reset request (--reason=MainClearConfirm) is detected, and the cache is cleared.\nAt the next FRS/UDS step Keymint creates a new secret and the bootloader sets the flag back to 0.\nThe bootloader clears only exactly 1, so 2 or more can make the regeneration repeat.\nIt does not erase userdata itself, but it is tied to security key derivation.\nIt is not an IPC logging setting.\n(Confirmed)"
editable = false

[[field]]
key = "reserved_0CA1"
offset = 0x0CA1
size = 3
kind = "bytes"
class = "advanced"
description = "Alignment/reserved"
help = "The 3 bytes between the FDR flag and the cache length, most likely alignment space.\nNo function of its own has been found.\n(Unconfirmed)"

[[field]]
key = "frs_uds_cache_length"
offset = 0x0CA4
size = 4
kind = "uint"
class = "protected"
description = "FRS/UDS cache length"
help = "Valid length of the security secret cache below.\nThe normal value is 32, and Keymint refuses lengths over 32.\n0 means there is no cache; whether a new secret is created depends on the storage state and the FDR flag together.\n(Confirmed)"
editable = false

[[field]]
key = "frs_uds_cache"
offset = 0x0CA8
size = 0x20
kind = "bytes"
class = "protected"
description = "FRS/UDS cache (device-unique)"
help = "Copy of the 32-byte security secret (SECRET) used to derive FRS.\nIt is not the FRS result itself.\nKeymint uses the FRS derived from it to encrypt some keys, so never copy another device's value or restore an old value.\nIt can change, for example with a factory reset, so it is not a fixed device ID.\n(Confirmed. Internal meaning based on TB520FU Keymint)"
editable = false

[[field]]
key = "region_magic_1"
offset = 0x0CC8
size = 8
kind = "text"
class = "protected"
description = "Region record magic 1"
help = "Start marker of the region record: ASCII deadbeef.\nOnly when both markers match does the bootloader use the stored region in its check; otherwise it takes the path that creates the region record anew.\nIt is not a signature or checksum.\n(Confirmed)"
editable = false

[[field]]
key = "region_info_version"
offset = 0x0CD0
size = 4
kind = "uint"
class = "protected"
description = "Region record version"
help = "Region record version.\nThe normal value is 1; 2 or more is handled as a version mismatch.\n(Confirmed)"
editable = false

[[field]]
key = "region"
offset = 0x0CD4
size = 3
kind = "region"
class = "basic"
description = "Region"
help = "Device region: PRC or ROW, 3 bytes.\nAt boot it is compared with the region in the firmware DTB (build_region of /product_region); if they differ, the tablet shows an incompatible system notice and stops booting.\nIt is separate from the country code.\n(Confirmed)"

[[field]]
key = "region_fill"
offset = 0x0CD7
size = 13
kind = "bytes"
class = "protected"
description = "Region zero fill"
help = "The remaining 13 bytes of the 16-byte region string space after its first 3 bytes.\nIn a normal state they are all 0.\nIt is not a separate country code field.\n(Confirmed)"
editable = false

[[field]]
key = "region_magic_2"
offset = 0x0CE4
size = 8
kind = "text"
class = "protected"
description = "Region record magic 2"
help = "End marker of the region record: ASCII beefdead.\nSame role as region_magic_1.\n(Confirmed)"
editable = false

[[field]]
key = "region_reserved"
offset = 0x0CEC
size = 0x28
kind = "bytes"
class = "advanced"
description = "Region record trailer (unidentified)"
help = "An unconfirmed area inside the logical DeviceInfo.\nThe function of its individual bytes has not been found.\nIt is read and saved together when the whole structure or the region record is handled.\nThere is no evidence that it has no function and can be set to 0.\n(Unconfirmed)"

[[field]]
key = "fastboot_mode"
offset = 0x0D14
size = 1
kind = "uint"
class = "advanced"
description = "Fastboot boot mode flag"
help = "0 = blocked\n1 = allowed\n\nWhether entering Fastboot with a key combination at power-on (hotkey) is allowed.\nIt does not show that the tablet is in Fastboot now, and it is not a request to boot into Fastboot next.\nIt does not block other ways in, such as a reboot command.\n(Confirmed)"
choices = ["0", "1"]

[[field]]
key = "recovery_mode"
offset = 0x0D15
size = 1
kind = "uint"
class = "advanced"
description = "Recovery boot mode flag"
help = "0 = blocked\n1 = allowed\n\nWhether entering Recovery with a key combination (hotkey) is allowed.\nIt is separate from the boot-recovery request in misc, so it does not block every way into Recovery.\n(Confirmed)"
choices = ["0", "1"]

[[field]]
key = "factory_mode"
offset = 0x0D16
size = 1
kind = "uint"
class = "advanced"
description = "Factory boot mode flag"
help = "Stored value related to factory and diagnostic modes; it is not a factory reset flag.\nReading and saving it are confirmed, but no effect on entering FFBM has been found.\n(Partly confirmed)"
choices = ["0", "1"]

[[field]]
key = "deviceinfo_format_version"
offset = 0x0D17
size = 4
kind = "text_nul"
class = "protected"
description = "DeviceInfo format version"
help = "DeviceInfo format version string; the normal value is 1.0.\nIf it differs, at boot the bootloader rewrites fastboot_mode, recovery_mode and factory_mode all to 1 and corrects the version to 1.0.\nIt is not for display; it decides three other settings.\n(Confirmed)"
editable = false

[[field]]
key = "reserved_end"
offset = 0x0D1B
size = 5
kind = "bytes"
class = "advanced"
description = "Trailing reserved"
help = "The unconfirmed 5 bytes at the end of the structure.\nNo function has been found.\n(Unconfirmed)"
