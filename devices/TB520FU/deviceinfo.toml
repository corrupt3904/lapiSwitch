# TB520FU DeviceInfo field map.
#
# The fields must cover 0..logical_size without gaps or overlaps; this is checked at build time.
# kind:  flag (1 byte, 0/1) · uint (little-endian, 1/2/4/8 bytes) · region (PRC/ROW, 3 bytes)
#        text (ASCII, NUL padded) · text_nul (ASCII, the last byte stays NUL) · bytes (hex)
# class: basic · advanced · protected (security/structure fields: changing them on the advanced tab needs a risk confirmation)
# count/stride: a repeated field. {n} in key becomes 0..count-1 and offset grows by stride.
# editable = false: read-only. choices: the only values that can be chosen.
# decimal = true: a uint shown and entered in decimal only; max_digits limits its digits.
# Required fields: magic, is_unlocked, is_unlock_critical, region, region_fill (13 bytes after
# region, read-only), rollback_index[0..31]
# Names and help shown in the app: devices/text/<lang>.toml, shared by every device.

logical_size = 0x0EA8

[[field]]
key = "magic"
offset = 0x0000
size = 0x0D
kind = "text"
class = "protected"
editable = false

[[field]]
key = "is_unlocked"
offset = 0x000D
size = 1
kind = "uint"
class = "protected"
choices = ["0", "1"]

[[field]]
key = "is_unlock_critical"
offset = 0x000E
size = 1
kind = "uint"
class = "protected"
choices = ["0", "1"]

[[field]]
key = "charger_screen_enabled"
offset = 0x000F
size = 1
kind = "flag"
class = "basic"
choices = ["0", "1"]

[[field]]
key = "bootloader_version"
offset = 0x0010
size = 0x40
kind = "text_nul"
class = "advanced"

[[field]]
key = "radio_version"
offset = 0x0050
size = 0x40
kind = "text_nul"
class = "advanced"

[[field]]
key = "verity_mode"
offset = 0x0090
size = 1
kind = "uint"
class = "protected"
choices = ["0", "1"]

[[field]]
key = "reserved_0091"
offset = 0x0091
size = 3
kind = "bytes"
class = "advanced"

[[field]]
key = "user_public_key_length"
offset = 0x0094
size = 4
kind = "uint"
class = "protected"

[[field]]
key = "user_public_key"
offset = 0x0098
size = 0x800
kind = "bytes"
class = "protected"

[[field]]
