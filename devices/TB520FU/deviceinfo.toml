# TB520FU DeviceInfo 필드 맵.
#
# 모든 필드가 0부터 logical_size까지 빈틈·겹침 없이 덮어야 합니다. 빌드할 때 검사합니다.
# kind:  flag (1바이트 0/1) · uint (리틀엔디언 1/2/4/8바이트) · region (PRC/ROW, 16바이트)
#        text (ASCII, NUL 채움) · text_nul (ASCII, 마지막 1바이트는 NUL 유지) · bytes (16진수)
# class: basic · advanced · protected (보안·구조 필드: 사용자지정 탭에서 바꾸면 위험 확인 필요)
# count/stride: 같은 모양이 반복되는 필드. key의 {n}이 0..count-1로 바뀌고 offset은 stride씩 증가합니다.
# 필수 필드: magic, is_unlocked, is_unlock_critical, region, rollback_index[0..31]

logical_size = 0x0EA8

[[field]]
key = "magic"
offset = 0x0000
size = 0x0D
kind = "text"
class = "protected"
description = "DeviceInfo 매직"

[[field]]
key = "is_unlocked"
offset = 0x000D
size = 1
kind = "uint"
class = "protected"
description = "부트로더 잠금 해제 상태"

[[field]]
key = "is_unlock_critical"
offset = 0x000E
size = 1
kind = "uint"
class = "protected"
description = "critical 잠금 해제 상태"

