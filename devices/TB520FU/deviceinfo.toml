# TB520FU DeviceInfo field map.
#
# The fields must cover 0..logical_size without gaps or overlaps; this is checked at build time.
# kind:  flag (1 byte, 0/1) · uint (little-endian, 1/2/4/8 bytes) · region (PRC/ROW, 16 bytes)
#        text (ASCII, NUL padded) · text_nul (ASCII, the last byte stays NUL) · bytes (hex)
# class: basic · advanced · protected (security/structure fields: changing them in the custom tab needs a risk confirmation)
# count/stride: a repeated field. {n} in key becomes 0..count-1 and offset grows by stride.
# Required fields: magic, is_unlocked, is_unlock_critical, region, rollback_index[0..31]

logical_size = 0x0EA8
persistent_help = "Storage where AVB remembers state between boots: 8 name/value records. For example, avb.managed_verity_mode is stored here. AVB can change the contents during boot. Empty records do not mean AVB is off. This is a different area from the persist.img partition. (Confirmed)"
rollback_help = "AVB anti-rollback reference values: 32 entries, each a 64-bit integer. The number is the AVB rollback_index_location, not an A/B slot. An image whose rollback index is lower than this value gives a rollback error, and whether boot actually stops also depends on the lock state. The bootloader can raise and store the value during boot. Even if it looks like a date, it is a security reference value, not a release date. (Confirmed)"

[[field]]
key = "magic"
offset = 0x0000
size = 0x0D
kind = "text"
class = "protected"
description = "DeviceInfo magic"
help = "DeviceInfo format identifier: the 13 bytes ANDROID-BOOT!. If it differs at boot, the bootloader clears the whole DeviceInfo to 0 and rebuilds the defaults, which also loses the public key, rollback indices, AVB persistent values and region. It is not a signature or checksum, so a matching value does not mean the rest is valid. (Confirmed)"
editable = false

[[field]]
key = "is_unlocked"
offset = 0x000D
size = 1
kind = "uint"
class = "protected"
description = "Bootloader unlock state"
help = "General bootloader lock state. 0 = locked, 1 = unlocked. AVB uses it to decide whether verification errors are allowed, and it is tied to the Fastboot lock display and to flashing and erase limits, so it is a real security decision value. The official lock change also updates the security state and requests a data wipe, which is not the same as changing only this byte. (Confirmed)"
choices = ["0", "1"]

[[field]]
key = "is_unlock_critical"
offset = 0x000E
size = 1
kind = "uint"
class = "protected"
description = "Critical unlock state"
help = "Extra lock state for critical partitions. 0 = extra lock kept, 1 = unlocked. With 0, flashing and erasing partitions classed as critical are refused. Even with is_unlocked = 1, the critical partition limit stays while this is 0. (Confirmed)"
choices = ["0", "1"]

[[field]]
key = "charger_screen_enabled"
offset = 0x000F
size = 1
kind = "flag"
class = "basic"
description = "Charger screen enabled"
help = "Stored off-mode charging policy (off-mode-charge) for when a charger is connected while the tablet is off. 0 = enabled, 1 = disabled. Entering the charging screen also depends on charger detection and other boot requests. It does not show whether the tablet is charging now. (Confirmed)"
choices = ["0", "1"]

[[field]]
key = "bootloader_version"
offset = 0x0010
size = 0x40
kind = "text_nul"
class = "advanced"
description = "Bootloader version string"
help = "Bootloader version string shown by Fastboot version-bootloader. Changing it does not change the actual bootloader code or security patch level. It is used as a string, so it must keep a terminating 0 byte at the end. (Confirmed)"

[[field]]
key = "radio_version"
offset = 0x0050
size = 0x40
kind = "text_nul"
class = "advanced"
description = "Radio/baseband version string"
help = "Radio/baseband version string shown by Fastboot version-baseband. Changing it does not change the actual modem firmware. (Confirmed)"

[[field]]
key = "verity_mode"
offset = 0x0090
size = 1
kind = "uint"
class = "protected"
description = "Verity mode"
help = "Bootloader verity state. 0 = logging, 1 = enforcing. On the AVB2 path a value of 0 adds the \"restarted due to hashtree corruption\" flag. The final error handling (restart or EIO) is set together by the AVB persistent value avb.managed_verity_mode and the image settings. 2 or more is not a valid mode and makes the bootloader read past its table (boot color strings). (Confirmed)"
choices = ["0", "1"]

[[field]]
key = "reserved_0091"
offset = 0x0091
size = 3
kind = "bytes"
class = "advanced"
description = "Alignment/reserved"
help = "The 3 bytes after verity_mode, most likely space that aligns the next 4-byte integer. No function of its own has been found. There is no evidence that it is unused and free to change. (Unconfirmed)"

[[field]]
key = "user_public_key_length"
offset = 0x0094
size = 4
kind = "uint"
class = "protected"
description = "User public key length"
help = "Number of valid bytes in the user AVB public key below (at most 2048). 0 means no user key is registered; the manufacturer's built-in keys stay. It is not an RSA bit size or an algorithm number. A length that does not match the contents can break the public key trust decision. (Confirmed)"

[[field]]
key = "user_public_key"
offset = 0x0098
size = 0x800
kind = "bytes"
class = "protected"
description = "User public key"
help = "User-registered AVB public key. The bootloader compares the image's public key with it, length and contents, to decide whether to trust it; if they differ it compares with the manufacturer's built-in keys. Changing it affects the AVB trust decision. It is not a private key, so it cannot make signatures on its own. (Confirmed)"

[[field]]
key = "rollback_index[{n}]"
offset = 0x0898
size = 8
count = 32
stride = 8
kind = "uint"
class = "basic"
description = "Rollback index"
help = "AVB anti-rollback reference values: 32 entries, each a 64-bit integer. The number is the AVB rollback_index_location, not an A/B slot. An image whose rollback index is lower than this value gives a rollback error, and whether boot actually stops also depends on the lock state. The bootloader can raise and store the value during boot. Even if it looks like a date, it is a security reference value, not a release date. (Confirmed)"
decimal = true
max_digits = 10

[[field]]
key = "persistent[{n}].valid"
offset = 0x0998
size = 2
count = 8
stride = 0x5E
kind = "uint"
class = "protected"
description = "AVB persistent value in use"
help = "Whether this record is in use. Only exactly 1 means in use; 2 or more is treated as an empty record. (Confirmed)"
choices = ["0", "1"]

[[field]]
key = "persistent[{n}].name_length"
offset = 0x099A
size = 2
count = 8
stride = 0x5E
kind = "uint"
class = "protected"
description = "AVB persistent value name length"
help = "Number of bytes used to compare the name (at most 56). (Confirmed)"

[[field]]
key = "persistent[{n}].value_length"
offset = 0x099C
size = 2
count = 8
stride = 0x5E
kind = "uint"
class = "protected"
description = "AVB persistent value data length"
help = "Valid length of the value (at most 32). (Confirmed)"

[[field]]
key = "persistent[{n}].name"
offset = 0x099E
size = 0x38
count = 8
stride = 0x5E
kind = "text"
class = "protected"
description = "AVB persistent value name"
help = "Record name. Its range is set by the length field, so it may have no terminating 0 byte. (Confirmed)"

[[field]]
key = "persistent[{n}].value"
offset = 0x09D6
size = 0x20
count = 8
stride = 0x5E
kind = "bytes"
class = "protected"
description = "AVB persistent value data"
help = "Raw data for the name. It cannot be read uniformly as a string or an integer. (Confirmed)"

[[field]]
key = "golden_snapshot"
offset = 0x0C88
size = 8
kind = "uint"
class = "advanced"
description = "Golden snapshot (presumed)"
help = "8-byte value compared with the constant 0x575757. It is not a 0/1 setting, so 1 does not mean true. The name comes from an outside structure, and the official name is unconfirmed. In both analysed bootloaders the related display path (Erase swap on restore) is off, and no actual snapshot restore or swap erase was found. (Partly confirmed)"
choices = ["0x0", "0x575757"]

[[field]]
key = "audio_framework"
offset = 0x0C90
size = 0x10
kind = "text"
class = "advanced"
description = "Audio framework buffer"
help = "Audio framework name passed at boot as androidboot.audio=<name>. The allowed names are audioreach, elite and awe, case-sensitive. Any other value is cleared to an empty string and saved during boot. It is not an audio firmware version or a sound setting. (Confirmed)"
choices = ["audioreach", "elite", "awe"]

[[field]]
key = "fdr_frs_uds_flag"
offset = 0x0CA0
size = 1
kind = "uint"
class = "protected"
description = "FDR/FRS-UDS state"
help = "Request flag to create a new security secret after a factory data reset (FDR). It is set to 1 when a specific reset request (--reason=MainClearConfirm) is detected, and the cache is cleared. At the next FRS/UDS step Keymint creates a new secret and the bootloader sets the flag back to 0. The bootloader clears only exactly 1, so 2 or more can make the regeneration repeat. It does not erase userdata itself, but it is tied to security key derivation. It is not an IPC logging setting. (Confirmed)"
editable = false

[[field]]
key = "reserved_0CA1"
offset = 0x0CA1
size = 3
kind = "bytes"
class = "advanced"
description = "Alignment/reserved"
help = "The 3 bytes between the FDR flag and the cache length, most likely alignment space. No function of its own has been found. (Unconfirmed)"

[[field]]
key = "frs_uds_cache_length"
offset = 0x0CA4
size = 4
kind = "uint"
class = "protected"
description = "FRS/UDS cache length"
help = "Valid length of the security secret cache below. The normal value is 32, and Keymint refuses lengths over 32. 0 means there is no cache; whether a new secret is created depends on the storage state and the FDR flag together. (Confirmed)"
editable = false

[[field]]
key = "frs_uds_cache"
offset = 0x0CA8
size = 0x20
kind = "bytes"
class = "protected"
description = "FRS/UDS cache (device-unique)"
help = "Copy of the 32-byte security secret (SECRET) used to derive FRS. It is not the FRS result itself. Keymint uses the FRS derived from it to encrypt some keys, so never copy another device's value or restore an old value. It can change, for example with a factory reset, so it is not a fixed device ID. (Confirmed. Internal meaning based on TB520FU Keymint)"
editable = false

[[field]]
key = "region_magic_1"
offset = 0x0CC8
size = 8
kind = "text"
class = "protected"
description = "Region record magic 1"
help = "Start marker of the region record: ASCII deadbeef. Only when both markers match does the bootloader use the stored region in its check; otherwise it takes the path that creates the region record anew. It is not a signature or checksum. (Confirmed)"
editable = false

[[field]]
key = "oem_reserved_1"
offset = 0x0CD0
size = 0x40
kind = "bytes"
class = "advanced"
description = "OEM reserved (unidentified)"
help = "An unconfirmed area inside the logical DeviceInfo. The function of its individual bytes has not been found. It is read and saved together when the whole structure or the region record is handled. There is no evidence that it has no function and can be set to 0. (Unconfirmed)"

[[field]]
key = "region"
offset = 0x0D10
size = 3
kind = "region"
class = "basic"
description = "Region"
help = "Device region: PRC or ROW, 3 bytes. At boot it is compared with the region in the firmware DTB (region_country); if they differ, the tablet shows an incompatible system notice and stops booting. It is separate from the country code. (Confirmed)"

[[field]]
key = "region_fill"
offset = 0x0D13
size = 13
kind = "bytes"
class = "protected"
description = "Region zero fill"
help = "The remaining 13 bytes of the 16-byte region string space after its first 3 bytes. In a normal state they are all 0. It is not a separate country code field. (Confirmed)"
editable = false

[[field]]
key = "region_magic_2"
offset = 0x0D20
size = 8
kind = "text"
class = "protected"
description = "Region record magic 2"
help = "End marker of the region record: ASCII beefdead. Same role as region_magic_1. (Confirmed)"
editable = false

[[field]]
key = "region_padding"
offset = 0x0D28
size = 8
kind = "bytes"
class = "advanced"
description = "Region trailer (unidentified)"
help = "An unconfirmed area inside the logical DeviceInfo. The function of its individual bytes has not been found. It is read and saved together when the whole structure or the region record is handled. There is no evidence that it has no function and can be set to 0. (Unconfirmed)"

[[field]]
key = "oem_reserved_2"
offset = 0x0D30
size = 0x170
kind = "bytes"
class = "advanced"
description = "OEM reserved (unidentified)"
help = "An unconfirmed area inside the logical DeviceInfo. The function of its individual bytes has not been found. It is read and saved together when the whole structure or the region record is handled. There is no evidence that it has no function and can be set to 0. (Unconfirmed)"

[[field]]
key = "fastboot_mode"
offset = 0x0EA0
size = 1
kind = "uint"
class = "advanced"
description = "Fastboot boot mode flag"
help = "Whether entering Fastboot with a key combination at power-on (hotkey) is allowed. 0 = allowed, 1 = blocked. It does not show that the tablet is in Fastboot now, and it is not a request to boot into Fastboot next. It does not block other ways in, such as a reboot command. (Confirmed)"
choices = ["0", "1"]

[[field]]
key = "recovery_mode"
offset = 0x0EA1
size = 1
kind = "uint"
class = "advanced"
description = "Recovery boot mode flag"
help = "Whether entering Recovery with a key combination (hotkey) is allowed. 0 = allowed, 1 = blocked. It is separate from the boot-recovery request in misc, so it does not block every way into Recovery. (Confirmed)"
choices = ["0", "1"]

[[field]]
key = "factory_mode"
offset = 0x0EA2
size = 1
kind = "uint"
class = "advanced"
description = "Factory boot mode flag"
help = "Stored value related to factory and diagnostic modes; it is not a factory reset flag. With 0, the factory mode boot arguments (androidboot.mode=, ffbm-00) are allowed to be passed; another mode request must also be present for them to take effect. (Confirmed)"
choices = ["0", "1"]

[[field]]
key = "reserved_end"
offset = 0x0EA3
size = 5
kind = "bytes"
class = "advanced"
description = "Trailing reserved"
help = "The unconfirmed 5 bytes at the end of the structure. No function has been found. (Unconfirmed)"
