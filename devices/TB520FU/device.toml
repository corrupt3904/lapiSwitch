# TB520FU device information. The folder name must equal model.

model = "TB520FU"
# Codename that may appear instead of the model name over ADB/EDL.
codename = "lapis"
# true: DeviceInfo can be dumped. This runs the backup, TWRP and restore flow, so [firmware], [installed], [twrp] and [country] are required.
deviceinfo_read = true
# true: DeviceInfo can be written (firmware flashing and DeviceInfo editing). Requires deviceinfo.toml.
deviceinfo_write = true

# Official firmware folder check.
[firmware]
loader = "xbl_s_devprg_ns.melf"
required_images = ["vbmeta_system.img", "vendor_boot.img", "boot.img", "vbmeta.img"]
# Where the vendor_boot DTB names the firmware region: region_country or product_region/build_region.
region_marker = "region_country"

# Accepted range of the firmware installed on the device.
# scheme: zui_version (e.g. ZUI_18.5.10.037_260408_ROW) or build_date (e.g. 10.028.260924C).
# Only entries with a matching region and family are accepted; with max, only that version or lower.
[installed]
scheme = "zui_version"

[[installed.allow]]
region = "PRC"
family = "ZUXOS"
max = "1.5.10.186"
label = "ZUXOS_1.5.10.186"

# The earlier PRC ZUI family is accepted without a version limit.
[[installed.allow]]
region = "PRC"
family = "ZUI"

[[installed.allow]]
region = "ROW"
family = "ZUI"
max = "18.5.10.37"
label = "ZUI_18.5.10.037"

# Official TWRP release to use. Its size and SHA-256 are checked on every use.
[twrp]
tag = "v3.7.1_16-20261014"
name = "TWRP-3.7.1_16-lapis-20261014-landscape.img"
size = 104857600
sha256 = "310ff2ecfc4c52060f9b6a0ad6f6e466a63a36d8ae87bc39f0c5408d2dcf24a4"
url = "https://github.com/lenovo-sm8650/android_device_lenovo_lapis-twrp/releases/download/v3.7.1_16-20261014/TWRP-3.7.1_16-lapis-20261014-landscape.img"

# Country code method: devinfo_persist (devinfo and persist patching) or oemowninfo (a fixed field of a partition).
[country]
method = "devinfo_persist"
