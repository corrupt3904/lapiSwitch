# TB520FU DeviceInfo: field names and help, 한국어.
#
# [field key] as in deviceinfo.toml (repeated fields keep {n}).
# name = shown name; help = the help window text, line breaks as written.
# A missing or empty entry falls back to en.toml.

["@rollback"]
help = """
AVB 롤백 방지 기준값 32개입니다.
각 칸은 64비트 정수입니다.
번호는 A/B 슬롯이 아니라 AVB의 rollback_index_location입니다.
이미지의 롤백 인덱스가 이 값보다 낮으면 롤백 오류가 되고, 실제 부팅 중단 여부는 잠금 상태도 함께 정합니다.
부팅 중 부트로더가 값을 올려 저장할 수 있습니다.
날짜처럼 보여도 출시일이 아니라 보안 기준값입니다.
(확정)
"""

["@persistent"]
help = """
AVB가 부팅 사이에 상태를 기억하는 저장소입니다.
이름/값 레코드 8개로 되어 있고, 예를 들어 avb.managed_verity_mode가 여기에 저장됩니다.
부팅 중 AVB가 내용을 바꿀 수 있습니다.
비어 있어도 AVB가 꺼졌다는 뜻은 아닙니다.
persist.img 파티션과는 다른 영역입니다.
(확정)
"""

[magic]
name = "DeviceInfo 식별 값(magic)"
help = """
DeviceInfo 형식 식별자로, ANDROID-BOOT! 13바이트입니다.
부팅 시 이 값이 다르면 부트로더가 DeviceInfo 전체를 0으로 지우고 기본값으로 다시 만듭니다.
이때 공개키, 롤백 인덱스, AVB 영속 값, 리전이 함께 사라집니다.
서명이나 체크섬이 아니어서, 값이 맞아도 나머지 내용이 정상이라는 뜻은 아닙니다.
(확정)
"""

[is_unlocked]
name = "부트로더 잠금 해제 상태"
help = """
0 = 부트로더 잠금
1 = 부트로더 잠금 해제

일반 부트로더 잠금 상태입니다.
AVB 검증에서 검증 오류를 허용할지 정하는 데 쓰이고, Fastboot 잠금 표시와 플래싱·삭제 제한에도 연결되는 실제 보안 판단 값입니다.
정식 잠금 변경 절차는 보안 상태 갱신과 데이터 초기화 요청까지 함께 처리하므로, 이 바이트만 바꾸는 것과는 다릅니다.
(확정)
"""

[is_unlock_critical]
name = "critical 잠금 해제 상태"
help = """
0 = 추가 잠금 유지
1 = 해제

중요 파티션에 대한 추가 잠금 상태입니다.
0이면 중요 파티션으로 분류된 대상의 플래싱·삭제가 거부됩니다.
is_unlocked = 1이어도 이 값이 0이면 중요 파티션 제한은 남습니다.
(확정)
"""

[charger_screen_enabled]
name = "충전 화면 표시 여부"
help = """
0 = 사용
1 = 사용 안 함

전원이 꺼진 상태에서 충전기를 연결했을 때의 충전 부팅 정책(off-mode-charge) 저장값입니다.
실제 충전 화면 진입은 충전기 감지와 다른 부팅 요청도 함께 판단합니다.
현재 충전 중인지 나타내는 값은 아닙니다.
(확정)
"""

[bootloader_version]
name = "부트로더 버전 문자열"
help = """
Fastboot version-bootloader로 표시되는 부트로더 버전 문자열입니다.
바꿔도 실제 부트로더 코드나 보안 패치 상태는 바뀌지 않습니다.
문자열로 쓰이므로 끝에 종료 문자(0)가 있는 형태를 유지해야 합니다.
(확정)
"""

[radio_version]
name = "라디오/베이스밴드 버전 문자열"
help = """
Fastboot version-baseband로 표시되는 Radio/Baseband 버전 문자열입니다.
바꿔도 실제 통신 펌웨어는 바뀌지 않습니다.
(확정)
"""

[verity_mode]
name = "verity 모드"
help = """
0 = logging
1 = enforcing

부트로더의 Verity 상태값입니다.
AVB2 경로에서는 값이 0일 때 “hashtree 손상으로 재부팅됨” 플래그를 추가합니다.
최종 오류 처리 방식(재부팅/EIO)은 AVB 영속 값(avb.managed_verity_mode)과 이미지 설정이 함께 정합니다.
2 이상은 정상 모드가 아니며, 부트로더가 옆 표(부팅 색상 문자열)를 잘못 읽게 됩니다.
(확정)
"""

[reserved_0091]
name = "정렬용/예약 영역"
help = """
verity_mode 뒤의 3바이트로, 다음 4바이트 정수를 정렬하기 위한 공간으로 보입니다.
독립된 기능은 확인되지 않았습니다.
"사용하지 않으니 자유롭게 바꿔도 된다"는 근거는 없습니다.
(미확인)
"""

[user_public_key_length]
name = "사용자 공개키 길이"
help = """
아래 사용자 AVB 공개키의 유효 바이트 수입니다(최대 2048).
0이면 사용자 등록 공개키가 없는 상태이고, 제조사 내장 키는 그대로입니다.
RSA 비트 수나 알고리즘 번호가 아닙니다.
길이와 내용이 맞지 않으면 공개키 신뢰 판단에 문제가 생길 수 있습니다.
(확정)
"""

[user_public_key]
name = "사용자 공개키"
help = """
사용자가 등록한 AVB 공개키입니다.
부트로더는 이미지의 공개키와 길이·내용이 같은지 비교해 신뢰 여부를 정합니다.
맞지 않으면 제조사 내장 키와 비교합니다.
바꾸면 AVB 신뢰 판단에 영향을 줍니다.
개인키가 아니어서 이 값만으로 서명을 만들 수는 없습니다.
(확정)
"""

["rollback_index[{n}]"]
name = "롤백 인덱스"
help = """
AVB 롤백 방지 기준값 32개입니다.
각 칸은 64비트 정수입니다.
번호는 A/B 슬롯이 아니라 AVB의 rollback_index_location입니다.
이미지의 롤백 인덱스가 이 값보다 낮으면 롤백 오류가 되고, 실제 부팅 중단 여부는 잠금 상태도 함께 정합니다.
부팅 중 부트로더가 값을 올려 저장할 수 있습니다.
날짜처럼 보여도 출시일이 아니라 보안 기준값입니다.
(확정)
"""

["persistent[{n}].valid"]
name = "AVB 영구 저장 값 사용 여부"
help = """
이 레코드가 사용 중인지 표시합니다.
정확히 1일 때만 사용 중으로 보고, 2 이상은 빈 레코드처럼 취급합니다.
(확정)
"""

["persistent[{n}].name_length"]
name = "AVB 영구 저장 값의 이름 길이"
help = """
이름 비교에 쓰는 바이트 수입니다(최대 56).
(확정)
"""

["persistent[{n}].value_length"]
name = "AVB 영구 저장 값의 데이터 길이"
help = """
값의 유효 길이입니다(최대 32).
(확정)
"""

["persistent[{n}].name"]
name = "AVB 영구 저장 값의 이름"
help = """
항목 이름입니다.
길이 필드로 범위를 정하므로, 끝에 종료 문자가 없을 수도 있습니다.
(확정)
"""

["persistent[{n}].value"]
name = "AVB 영구 저장 값의 데이터"
help = """
이름에 대응하는 원시 데이터입니다.
문자열이나 정수로 일괄 해석할 수 없습니다.
(확정)
"""

[golden_snapshot]
name = "golden snapshot (추정)"
help = """
상수 0x575757과 비교되는 8바이트 값입니다.
0/1 설정이 아니어서 1을 넣어도 "참"이 되지 않습니다.
이름은 외부 구조체에서 온 것으로 공식 명칭은 확인되지 않았습니다.
분석한 두 부트로더에서는 관련 표시 경로(Erase swap on restore)가 꺼져 있고, 실제 스냅샷 복원이나 swap 삭제 기능은 확인되지 않았습니다.
(부분 확인)
"""

[audio_framework]
name = "오디오 프레임워크 버퍼"
help = """
부팅 시 androidboot.audio=<이름>으로 전달하는 오디오 프레임워크 이름입니다.
허용 이름은 audioreach, elite, awe이고 대소문자를 구분합니다.
다른 값을 넣으면 부팅 중 빈 문자열로 정리되고 저장됩니다.
오디오 펌웨어 버전이나 음질 설정이 아닙니다.
(확정)
"""

[fdr_frs_uds_flag]
name = "FDR/FRS-UDS 상태"
help = """
공장초기화(FDR) 후 보안 비밀값을 새로 만들라는 요청 플래그입니다.
특정 초기화 요청(--reason=MainClearConfirm)을 감지하면 1로 설정되고, 캐시가 비워집니다.
다음 FRS/UDS 처리에서 Keymint가 새 비밀값을 만들고, 부트로더가 0으로 되돌립니다.
부트로더는 정확히 1만 지우므로, 2 이상이 남으면 재생성이 반복될 수 있습니다.
userdata를 직접 지우지는 않지만 보안 키 파생에 연결되는 값입니다.
IPC 로깅 설정이 아닙니다.
(확정)
"""

[reserved_0CA1]
name = "정렬용/예약 영역"
help = """
FDR 플래그와 캐시 길이 사이의 3바이트로, 정렬 공간으로 보입니다.
독립된 기능은 확인되지 않았습니다.
(미확인)
"""

[frs_uds_cache_length]
name = "FRS/UDS 캐시 길이"
help = """
아래 보안 비밀값 캐시의 유효 길이입니다.
정상값은 32이고, Keymint는 32를 넘는 길이를 거부합니다.
0은 캐시가 없다는 뜻이며, 새 비밀값을 만들지는 저장소 상태와 FDR 플래그가 함께 정합니다.
(확정)
"""

[frs_uds_cache]
name = "FRS/UDS 캐시 (기기 고유)"
help = """
FRS 파생에 쓰이는 32바이트 보안 비밀값(SECRET)의 복사본입니다.
FRS 결과값 자체가 아닙니다.
Keymint의 일부 키 암호화에 이 값에서 나온 FRS가 쓰입니다.
그래서 다른 기기의 값을 복사하거나 예전 값으로 되돌리면 안 됩니다.
공장초기화 등으로 바뀔 수 있어 고정 기기 ID도 아닙니다.
(확정. 내부 의미는 TB520FU Keymint 기준)
"""

[region_magic_1]
name = "리전 레코드 식별 값 1(magic)"
help = """
리전 레코드 시작 표식으로, ASCII deadbeef입니다.
두 표식이 모두 맞아야 부트로더가 저장된 리전을 검사에 씁니다.
표식이 맞지 않으면 리전 기록을 새로 만드는 경로로 갑니다.
서명이나 체크섬은 아닙니다.
(확정)
"""

[oem_reserved_1]
name = "OEM 예약 영역(용도 미확인)"
help = """
논리 DeviceInfo에 포함된 미확인 영역입니다.
개별 바이트의 기능은 확인되지 않았습니다.
구조 전체나 리전 레코드 단위로 읽고 저장할 때 함께 처리됩니다.
"아무 기능이 없으니 0으로 만들어도 된다"는 근거는 없습니다.
(미확인)
"""

[region]
name = "리전"
help = """
기기 리전으로, PRC 또는 ROW 3바이트입니다.
부팅 때 펌웨어 DTB의 리전(region_country)과 비교해서 다르면 "호환되지 않는 시스템" 안내 후 부팅을 멈춥니다.
국가 코드와는 별개입니다.
(확정)
"""

[region_fill]
name = "리전 뒤 0 채움 영역"
help = """
16바이트 리전 문자열 공간에서 앞 3바이트를 뺀 나머지 13바이트입니다.
정상 상태에서는 모두 0입니다.
별도의 국가 코드 필드가 아닙니다.
(확정)
"""

[region_magic_2]
name = "리전 레코드 식별 값 2(magic)"
help = """
리전 레코드 끝 표식으로, ASCII beefdead입니다.
역할은 region_magic_1과 같습니다.
(확정)
"""

[region_padding]
name = "리전 데이터 끝부분(용도 미확인)"
help = """
논리 DeviceInfo에 포함된 미확인 영역입니다.
개별 바이트의 기능은 확인되지 않았습니다.
구조 전체나 리전 레코드 단위로 읽고 저장할 때 함께 처리됩니다.
"아무 기능이 없으니 0으로 만들어도 된다"는 근거는 없습니다.
(미확인)
"""

[oem_reserved_2]
name = "OEM 예약 영역(용도 미확인)"
help = """
논리 DeviceInfo에 포함된 미확인 영역입니다.
개별 바이트의 기능은 확인되지 않았습니다.
구조 전체나 리전 레코드 단위로 읽고 저장할 때 함께 처리됩니다.
"아무 기능이 없으니 0으로 만들어도 된다"는 근거는 없습니다.
(미확인)
"""

[fastboot_mode]
name = "Fastboot 부팅 모드 플래그"
help = """
0 = 허용
1 = 차단

전원을 켤 때 특정 키 조합으로 Fastboot에 들어가는 경로(핫키)를 허용할지 정합니다.
지금 Fastboot 모드인지 나타내는 값이나, 다음 부팅을 Fastboot로 지정하는 요청이 아닙니다.
재부팅 명령 같은 다른 진입 경로는 막지 않습니다.
(확정)
"""

[recovery_mode]
name = "Recovery 부팅 모드 플래그"
help = """
0 = 허용
1 = 차단

키 조합으로 Recovery에 들어가는 경로(핫키)를 허용할지 정합니다.
misc의 boot-recovery 요청과는 별개라서, 모든 Recovery 진입을 막지는 않습니다.
(확정)
"""

[factory_mode]
name = "공장 모드(factory) 부팅 플래그"
help = """
공장·진단 모드 관련 저장값입니다.
공장초기화 실행 플래그가 아닙니다.
0일 때 공장 모드 부팅 인자(androidboot.mode=, ffbm-00) 전달을 허용합니다.
다른 모드 요청이 함께 있어야 동작합니다.
(확정)
"""

[reserved_end]
name = "끝부분 예약 영역"
help = """
구조 끝의 미확인 5바이트입니다.
기능은 확인되지 않았습니다.
(미확인)
"""
