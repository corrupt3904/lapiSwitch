# DeviceInfo field names and help, Русский, for every device.
#
# [field key] as in devices/<MODEL>/deviceinfo.toml (repeated fields keep {n});
# ["@rollback"] and ["@persistent"] are the two group boxes.
# name = shown name; help = the help window text, line breaks as written.
# Where a device differs, give it its own text: help.<MODEL> = """..."""
# (name.<MODEL> likewise). A field only one device has is shown only there.
# In a repeated field {n} becomes the entry number; ["rollback_index[2]"] gives one entry its own text.
# A missing entry falls back to en.toml.

["@rollback"]
help = """
Эта область хранит опорные значения защиты от отката AVB (Android Verified Boot) и состоит из 32 целых чисел размером 8 байт каждое.
Номер каждой записи соответствует `rollback_index_location` в AVB.
Если индекс отката образа ниже сохранённого опорного значения, возникает ошибка проверки отката. Будет ли загрузка действительно заблокирована, может зависеть от состояния загрузчика: Locked или Unlocked.
Во время загрузки загрузчик может повышать индексы отката и сохранять новые значения.
"""

["@persistent"]
help = """
Это область постоянного хранения (Persistent Storage), которую AVB (Android Verified Boot) использует для сохранения состояния между загрузками.
В ней можно сохранить до 8 записей, каждая из которых состоит из имени (Name) и значения (Value).
Во время загрузки AVB при необходимости может читать или изменять сохранённые постоянные значения.
Отсутствие данных в этой области не означает, что AVB отключён.

"""

[magic]
name = "Идентификатор DeviceInfo (magic)"
help = """
Идентификатор формата DeviceInfo — строка ANDROID-BOOT! длиной 13 байт.
Если при загрузке это значение не совпадает с ожидаемым, загрузчик заполняет всю структуру DeviceInfo значением 0 и создаёт её заново со значениями по умолчанию.
При этом также удаляются открытый ключ, индексы отката, постоянные значения AVB, регион и другие данные.

"""

[is_unlocked]
name = "Флаг Unlock загрузчика"
help = """
0 = Загрузчик Locked
1 = Загрузчик Unlocked

Этот флаг указывает состояние загрузчика: Locked или Unlocked.
В состоянии Locked ошибка проверки AVB (Android Verified Boot) блокирует загрузку, а в состоянии Unlocked ошибки проверки допускаются.
В состоянии Unlocked параметр verifiedbootstate меняется на Orange, что может снизить уровень доверия таких механизмов безопасности, как Play Integrity и Widevine DRM.
При изменении этого флага загрузчик требует сброса пользовательских данных. Без выполнения сброса нормальная загрузка невозможна.

"""

[is_unlock_critical]
name = "Флаг Critical Unlock"
help = """
0 = Critical Locked
1 = Critical Unlocked

Этот флаг указывает состояние критических разделов: Locked или Unlocked.
В состоянии Critical Locked запись и стирание критических разделов через Fastboot заблокированы.
Даже если загрузчик находится в состоянии Unlocked, ограничения на операции с критическими разделами сохраняются, пока действует состояние Critical Locked.
При изменении этого флага загрузчик требует сброса пользовательских данных. Без выполнения сброса нормальная загрузка невозможна.

"""

[charger_screen_enabled]
name = "Отображение экрана зарядки"
help.TB520FU = """
0 = Включено
1 = Отключено

Эта настройка определяет, переходит ли выключенное устройство в режим только зарядки при подключении зарядного устройства.
Если настройка включена, при подключении зарядного устройства в зависимости от условий вместо обычной загрузки Android запускается режим только зарядки, отображающий уровень заряда батареи и другую информацию.
Если настройка отключена, переход в режим только зарядки пропускается.
Эта настройка не управляет самой функцией зарядки и не влияет на её скорость или отображение состояния зарядки при работающем Android.

"""
help.TB522FU = """
0 = Отключено
1 = Включено

Эта настройка определяет, переходит ли выключенное устройство в режим только зарядки при подключении зарядного устройства.
Если настройка включена, при подключении зарядного устройства в зависимости от условий вместо обычной загрузки Android запускается режим только зарядки, отображающий уровень заряда батареи и другую информацию.
Если настройка отключена, переход в режим только зарядки пропускается.
Эта настройка не управляет самой функцией зарядки и не влияет на её скорость или отображение состояния зарядки при работающем Android.

"""

[bootloader_version]
name = "Строка версии загрузчика"
help = """
Строка версии загрузчика, которую Fastboot отображает как version-bootloader.
Изменение этого значения не влияет на фактический код загрузчика или уровень исправлений безопасности.
Строка хранится в формате с нулевым завершением (Null-terminated string), поэтому в конце необходимо сохранять завершающий нулевой символ (\\0).

"""

[radio_version]
name = "Строка версии Radio/Baseband"
help = """
Строка версии Radio/Baseband, которую Fastboot отображает как version-baseband.
Изменение этого значения не влияет на фактический код загрузчика или уровень исправлений безопасности.
Строка хранится в формате с нулевым завершением (Null-terminated string), поэтому в конце необходимо сохранять завершающий нулевой символ (\\0).

"""

[verity_mode]
name = "Режим verity"
help = """
0 = logging
1 = enforcing

Это значение отражает состояние Verity в загрузчике.
В пути обработки AVB 2.0 значение 0 устанавливает флаг, указывающий на перезагрузку из-за повреждения Hashtree.
Окончательная реакция на ошибку Verity (перезагрузка или EIO) определяется постоянной настройкой AVB (avb.managed_verity_mode) и настройками образа.

"""

[reserved_0091]
name = "Зарезервированная область (предположительно для выравнивания)"
help = """
Эта область размером 3 байта следует за полем verity_mode и предположительно служит заполнением (Padding) для выравнивания в памяти (Alignment) следующего целочисленного поля размером 4 байта.
Самостоятельная функция или назначение этой области не установлены.
Считать эту область неиспользуемой нельзя, поэтому произвольно изменять её значения не рекомендуется.

"""

[user_public_key_length]
name = "Длина пользовательского открытого ключа"
help = """
Длина действительных данных зарегистрированного пользователем открытого ключа AVB в байтах. (Не более 2048 байт)
Значение 0 означает, что пользовательский открытый ключ не зарегистрирован, и не влияет на встроенный открытый ключ производителя.
Это значение указывает длину данных открытого ключа, а не размер ключа RSA в битах или идентификатор алгоритма шифрования.
Несоответствие указанной длины фактическим данным открытого ключа может вызвать проблемы при проверке ключа и определении доверия к нему.

"""

[user_public_key]
name = "Пользовательский открытый ключ AVB"
help.TB520FU = """
Данные пользовательского открытого ключа AVB (Android Verified Boot).
Загрузчик определяет, можно ли доверять открытому ключу образа, сравнивая его длину и содержимое с зарегистрированным пользовательским открытым ключом.
Если совпадения с пользовательским открытым ключом нет, выполняется дополнительная проверка по встроенному открытому ключу производителя.
Если в состоянии Locked проверка AVB выполняется с пользовательским открытым ключом AVB, verifiedbootstate меняется на Yellow, что может снизить уровень доверия таких механизмов безопасности, как Play Integrity и Widevine DRM.

"""
help.TB522FU = """
Данные пользовательского открытого ключа AVB (Android Verified Boot).
Загрузчик определяет, можно ли доверять открытому ключу образа, сравнивая его длину и содержимое с зарегистрированным пользовательским открытым ключом.
Если совпадения с пользовательским открытым ключом нет, выполняется дополнительная проверка по встроенному открытому ключу производителя.
Если в состоянии Locked проверка AVB выполняется с пользовательским открытым ключом AVB, verifiedbootstate меняется на Yellow, что может снизить уровень доверия таких механизмов безопасности, как Play Integrity и Widevine DRM.
(Для модели TB522FU официальный способ регистрации пользовательского открытого ключа AVB не предусмотрен.)

