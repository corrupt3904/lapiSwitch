Индексы отката можно вводить только в десятичном формате, не более 10 цифр.
Введённое значение преобразуется в целое число размером 8 байт и сохраняется в формате с порядком байтов от младшего к старшему (Little-endian).
"""

["rollback_index[3]"]
name = "Индекс отката (boot)"
help = """
Rollback Index Location: 3 - boot

Индексы отката можно вводить только в десятичном формате, не более 10 цифр.
Введённое значение преобразуется в целое число размером 8 байт и сохраняется в формате с порядком байтов от младшего к старшему (Little-endian).
"""

["persistent[{n}].valid"]
name = "Использование постоянного значения AVB"
help = """
0 = Не используется
1 = Используется

Этот флаг указывает, используется ли запись постоянного значения AVB (Persistent Value).
При значении 1 запись считается действительной и используется.
При значении 0 или 2 и выше запись считается неиспользуемой.

"""

["persistent[{n}].name_length"]
name = "Длина имени постоянного значения AVB"
help = """
Длина действительных данных имени в байтах, используемая при сравнении имён постоянных значений AVB (Persistent Value). (Не более 56 байт)
Это значение задаёт количество байтов, используемых при сравнении имён.
Если указанная длина не соответствует фактическим данным имени, постоянное значение может быть определено неверно.

"""

["persistent[{n}].value_length"]
name = "Длина данных постоянного значения AVB"
help = """
Длина действительных данных в байтах, сохранённых в постоянном значении AVB (Persistent Value). (Не более 32 байт)
Это значение задаёт количество байтов, используемых в качестве фактических данных.
Если указанная длина не соответствует фактическим данным, постоянное значение может читаться или обрабатываться неверно.

"""

["persistent[{n}].name"]
name = "Имя постоянного значения AVB"
help = """
Данные имени, используемые для идентификации записи постоянного значения AVB (Persistent Value).
Действительная длина имени определяется количеством байтов, указанным в поле `name_length`.
Поскольку диапазон данных задаётся отдельным полем длины, строка может не содержать завершающий нулевой символ (`\\0`).

"""

["persistent[{n}].value"]
name = "Данные постоянного значения AVB"
help = """
Необработанные данные, сохранённые под соответствующим именем постоянного значения AVB (Persistent Value).
Действительная длина данных определяется количеством байтов, указанным в поле `value_length`.
Формат и смысл сохранённых данных зависят от имени и назначения соответствующего постоянного значения.
Нельзя одинаково интерпретировать все данные как строки или целые числа. Изменение значения без учёта формата данных может повлиять на работу AVB.

"""

[golden_snapshot]
name = "golden snapshot (предположительно)"
help = """
Целое число размером 8 байт, состояние которого определяется сравнением с заданной константой (`0x575757`).
Это не простой флаг включения/отключения: ввод `1` не приводит к тому, что состояние считается включённым.
Название `golden_snapshot` взято из внешней структуры. Официальное название поля и его точное назначение не подтверждены.
В проанализированных загрузчиках связанный путь отображения `Erase swap on restore` отключён. Связь с фактическим восстановлением снимков или стиранием данных Swap не подтверждена.
Поскольку точное поведение и последствия изменения значения неизвестны, произвольно изменять его не рекомендуется.

"""

[audio_framework]
name = "Буфер аудиофреймворка"
help = """
Эта область хранит имя аудиофреймворка, передаваемое Android при загрузке через параметр `androidboot.audio`.
Допустимые значения: `audioreach`, `elite` и `awe`. Регистр символов учитывается.
Если введено недопустимое значение, при загрузке оно сбрасывается в пустую строку и сохраняется.
Это значение служит для идентификации аудиофреймворка, а не для изменения версии аудиопрошивки или качества звука.

"""

[fdr_frs_uds_flag]
name = "Состояние FDR/FRS-UDS"
help = """
Этот флаг запрашивает обновление секретного значения, связанного с FRS, при обнаружении определённого запроса сброса к заводским настройкам из Recovery.
При обнаружении определённого запроса сброса (`--reason=MainClearConfirm`) это значение устанавливается в 1, а связанный кэш очищается.
Если последующая обработка FRS/UDS завершается успешно, загрузчик сбрасывает флаг в 0 только в том случае, если он равен ровно 1, и сохраняет кэш, полученный в ответе.
Загрузчик очищает флаг только при значении ровно 1. Поэтому, если сохраняется значение 2 или выше, процесс повторного создания секретного значения может выполняться снова и снова.
Этот флаг не стирает пользовательские данные (Userdata) напрямую, но связан с выработкой ключей безопасности, поэтому произвольно изменять его не рекомендуется.

"""

[reserved_0CA1]
name = "Зарезервированная область (предположительно для выравнивания)"
help = """
Эта область размером 3 байта находится между флагом FDR и полем длины кэша и предположительно служит заполнением (Padding) для выравнивания в памяти (Alignment).
Самостоятельная функция или точное назначение этой области не установлены.
Считать эту область неиспользуемой нельзя, поэтому произвольно изменять её значения не рекомендуется.

"""

[frs_uds_cache_length]
name = "Длина кэша FRS/UDS"
help = """
Длина действительных данных в байтах, сохранённых в кэше секретного значения FRS/UDS.
Нормальная длина данных кэша составляет 32 байта. KeyMint отклоняет значения, превышающие 32 байта.
Значение 0 означает отсутствие сохранённых данных кэша.
Создание нового секретного значения зависит не только от длины кэша, но и от состояния хранилища и флага FDR.
Произвольное изменение этого значения может нарушить корректную обработку секретного значения.

"""

[frs_uds_cache]
name = "Кэш FRS/UDS (индивидуальный для устройства)"
help = """
Эта область хранит копию секретного значения (SECRET) размером 32 байта, используемого для выработки FRS.
Это исходное секретное значение для выработки FRS, а не сам результат FRS.
FRS, выработанный из этого значения, используется для защиты некоторых криптографических ключей KeyMint.
Копирование значения с другого устройства или восстановление предыдущего значения может привести к невозможности корректного использования существующих криптографических ключей.
Значение может меняться при таких операциях, как сброс к заводским настройкам, поэтому оно не является навсегда фиксированным идентификатором устройства (Device ID).
Это значение напрямую связано с выработкой ключей безопасности и защитой зашифрованных данных, поэтому произвольно изменять его не рекомендуется.

"""

[region_magic_1]
name = "Идентификатор записи региона 1 (magic)"
help.TB520FU = """
Это маркер (Magic Value), обозначающий начало записи региона (Region). В нём хранится строка ASCII `deadbeef`.
Только при совпадении обоих идентификаторов региона загрузчик считает сохранённую информацию о регионе действительной и использует её для проверки.
Если хотя бы один идентификатор не совпадает, загрузчик не использует существующую информацию о регионе и переходит к созданию новой записи региона.
Это фиксированный маркер для идентификации записи, а не подпись или контрольная сумма для проверки целостности данных.
Произвольное изменение этого значения может привести к тому, что существующая информация о регионе будет признана недействительной.

"""

help.TB522FU = """
Это маркер (Magic Value), обозначающий начало записи региона (Region). В нём хранится строка ASCII `deadbeef`.
Только при совпадении обоих идентификаторов региона загрузчик считает сохранённую информацию о регионе действительной и использует её для проверки.
Если совпадает только один идентификатор, информация считается повреждённой и загрузка отклоняется. Если не совпадают оба, информация о регионе создаётся заново только при состоянии загрузки green на момент вызова.
Это фиксированный маркер для идентификации записи, а не подпись или контрольная сумма для проверки целостности данных.
