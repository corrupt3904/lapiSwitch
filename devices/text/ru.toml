# DeviceInfo field names and help, Русский, for every device.
#
# [field key] as in devices/<MODEL>/deviceinfo.toml (repeated fields keep {n});
# ["@rollback"] and ["@persistent"] are the two group boxes.
# name = shown name; help = the help window text, line breaks as written.
# Where a device differs, give it its own text: help.<MODEL> = """..."""
# (name.<MODEL> likewise). A field only one device has is shown only there.
# In a repeated field {n} becomes the entry number; ["rollback_index[2]"] gives one entry its own text.
# A missing entry falls back to en.toml.

["@rollback"]
help = """
Опорные значения защиты от отката AVB: 32 записи, каждая — 64-битное целое.
Номер — это rollback_index_location AVB, а не слот A/B.
Если индекс отката образа ниже этого значения, возникает ошибка отката; прервётся ли загрузка, зависит также от состояния блокировки.
Загрузчик может повышать и сохранять значение во время загрузки.
Даже если оно похоже на дату, это не дата выпуска, а опорное значение безопасности.
(Подтверждено)

"""

["@persistent"]
help = """
Хранилище, в котором AVB запоминает состояние между загрузками: 8 записей «имя/значение».
Например, здесь хранится avb.managed_verity_mode.
AVB может менять содержимое во время загрузки.
Пустые записи не означают, что AVB выключен.
Это область, отличная от раздела persist.img.
(Подтверждено)

"""

[magic]
name = "Идентификатор DeviceInfo (магическое значение)"
help = """
Идентификатор формата DeviceInfo — 13 байт ANDROID-BOOT!.
Если при загрузке значение отличается, загрузчик обнуляет весь DeviceInfo и создаёт значения по умолчанию заново; при этом теряются открытый ключ, индексы отката, сохраняемые значения AVB и регион.
Это не подпись и не контрольная сумма, поэтому совпадение значения не означает, что остальное содержимое в порядке.
(Подтверждено)

"""

[is_unlocked]
name = "Состояние разблокировки загрузчика"
help = """
0 = загрузчик заблокирован
1 = загрузчик разблокирован

Общее состояние блокировки загрузчика.
AVB использует его, чтобы решить, допускать ли ошибки проверки; оно также связано с отображением блокировки в Fastboot и ограничениями прошивки и стирания, то есть это реальное значение для решений безопасности.
Официальная смена блокировки также обновляет состояние безопасности и запрашивает очистку данных, что не равно изменению только этого байта.
(Подтверждено)

"""

[is_unlock_critical]
name = "Состояние critical-разблокировки"
help = """
0 = дополнительная блокировка сохраняется
1 = снята

Дополнительная блокировка критических разделов.
При 0 прошивка и стирание разделов, отнесённых к критическим, запрещены.
Даже при is_unlocked = 1 ограничение критических разделов остаётся, пока это значение равно 0.
(Подтверждено)

"""

[charger_screen_enabled]
name = "Показ экрана зарядки"
help.TB520FU = """
0 = включено
1 = выключено

Сохранённая политика зарядки в выключенном состоянии (off-mode-charge) при подключении зарядного устройства.
Переход на экран зарядки также зависит от обнаружения зарядного устройства и других запросов загрузки.
Значение не показывает, идёт ли зарядка сейчас.
(Подтверждено)

"""
help.TB522FU = """
0 = выключено
1 = включено

Сохранённая политика зарядки в выключенном состоянии (off-mode-charge) при подключении зарядного устройства.
Переход на экран зарядки также зависит от обнаружения зарядного устройства и других запросов загрузки.
Значение не показывает, идёт ли зарядка сейчас.
(Подтверждено)

"""

[bootloader_version]
name = "Строка версии загрузчика"
help = """
Строка версии загрузчика, которую показывает Fastboot version-bootloader.
Её изменение не меняет ни код загрузчика, ни уровень исправлений безопасности.
Она используется как строка, поэтому в конце должен оставаться завершающий байт 0.
(Подтверждено)

"""

[radio_version]
name = "Строка версии радио/модема"
help = """
Строка версии радио/модема, которую показывает Fastboot version-baseband.
Её изменение не меняет реальную прошивку модема.
(Подтверждено)

"""

[verity_mode]
name = "Режим verity"
help = """
0 = logging
1 = enforcing

Состояние verity загрузчика.
На пути AVB2 при значении 0 добавляется флаг «перезагрузка из-за повреждения hashtree».
Итоговую обработку ошибок (перезагрузка/EIO) определяют сохраняемое значение AVB avb.managed_verity_mode и настройки образа.
2 и больше — не допустимый режим: загрузчик начинает неверно читать соседнюю таблицу (строки цвета загрузки).
(Подтверждено)

"""

[reserved_0091]
name = "Область выравнивания / резерв"
help = """
3 байта после verity_mode, по-видимому, место для выравнивания следующего 4-байтового целого.
Собственной функции не обнаружено.
Оснований считать, что оно не используется и его можно свободно менять, нет.
(Не подтверждено)

"""

[user_public_key_length]
name = "Длина пользовательского открытого ключа"
help = """
Число действительных байт пользовательского открытого ключа AVB ниже (не более 2048).
0 означает, что пользовательский ключ не зарегистрирован; встроенные ключи производителя остаются.
Это не размер RSA в битах и не номер алгоритма.
Если длина не соответствует содержимому, решение о доверии ключу может нарушиться.
(Подтверждено)

"""

[user_public_key]
name = "Пользовательский открытый ключ"
help.TB520FU = """
Пользовательский открытый ключ AVB.
Загрузчик сравнивает с ним длину и содержимое открытого ключа образа, чтобы решить, доверять ли ему; при несовпадении сравнивает со встроенными ключами производителя.
Изменение влияет на решение AVB о доверии.
Это не закрытый ключ, поэтому только с ним подпись создать нельзя.
(Подтверждено)

"""
help.TB522FU = """
Пользовательский открытый ключ AVB.
Загрузчик сравнивает с ним длину и содержимое открытого ключа образа, чтобы решить, доверять ли ему; при несовпадении сравнивает со встроенными ключами производителя.
Изменение влияет на решение AVB о доверии.
Это не закрытый ключ, поэтому только с ним подпись создать нельзя.
(Подтверждено. Для TB522FU путь команды регистрации не подтверждён.)

"""

["rollback_index[{n}]"]
name = "Индекс отката (не используется)"
help = """
Rollback Index Location: {n} - не используется

Индекс отката вводится только в десятичном виде, не более 10 цифр.
Введённое значение преобразуется в 8-байтовое целое и сохраняется в порядке little-endian.
"""

["rollback_index[0]"]
name = "Индекс отката (vbmeta)"
help = """
Rollback Index Location: 0 - vbmeta

Индекс отката вводится только в десятичном виде, не более 10 цифр.
Введённое значение преобразуется в 8-байтовое целое и сохраняется в порядке little-endian.
"""

["rollback_index[1]"]
name = "Индекс отката (recovery)"
help = """
Rollback Index Location: 1 - recovery

Индекс отката вводится только в десятичном виде, не более 10 цифр.
Введённое значение преобразуется в 8-байтовое целое и сохраняется в порядке little-endian.
"""

["rollback_index[2]"]
name = "Индекс отката (vbmeta_system)"
help = """
Rollback Index Location: 2 - vbmeta_system

Индекс отката вводится только в десятичном виде, не более 10 цифр.
