["rollback_index[{n}]"]
name = "Индекс отката (не используется)"
help = """
Rollback Index Location: {n} - Не используется

Индексы отката можно вводить только в десятичном формате, не более 10 цифр.
Введённое значение преобразуется в целое число размером 8 байт и сохраняется в формате с порядком байтов от младшего к старшему (Little-endian).
"""

["rollback_index[0]"]
name = "Индекс отката (vbmeta)"
help = """
Rollback Index Location: 0 - vbmeta

Индексы отката можно вводить только в десятичном формате, не более 10 цифр.
Введённое значение преобразуется в целое число размером 8 байт и сохраняется в формате с порядком байтов от младшего к старшему (Little-endian).
"""

["rollback_index[1]"]
name = "Индекс отката (recovery)"
help = """
Rollback Index Location: 1 - recovery

Индексы отката можно вводить только в десятичном формате, не более 10 цифр.
Введённое значение преобразуется в целое число размером 8 байт и сохраняется в формате с порядком байтов от младшего к старшему (Little-endian).
"""

["rollback_index[2]"]
name = "Индекс отката (vbmeta_system)"
help = """
