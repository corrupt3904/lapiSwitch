["persistent[{n}].valid"]
name = "Состояние использования сохраняемого значения AVB"
help = """
Используется ли эта запись.
В использовании только при значении ровно 1; 2 и больше считаются пустой записью.
(Подтверждено)

"""

["persistent[{n}].name_length"]
name = "Длина имени сохраняемого значения AVB"
help = """
Число байт, используемых для сравнения имени (не более 56).
(Подтверждено)

"""

["persistent[{n}].value_length"]
name = "Длина данных сохраняемого значения AVB"
help = """
Действительная длина значения (не более 32).
(Подтверждено)

"""

["persistent[{n}].name"]
name = "Имя сохраняемого значения AVB"
help = """
Имя записи.
Его границы задаёт поле длины, поэтому завершающего байта 0 может не быть.
(Подтверждено)

"""

["persistent[{n}].value"]
name = "Данные сохраняемого значения AVB"
help = """
Необработанные данные для имени.
Их нельзя единообразно читать как строку или целое число.
(Подтверждено)

"""

[golden_snapshot]
name = "Golden snapshot (предположительно)"
help = """
8-байтовое значение, сравниваемое с константой 0x575757.
Это не настройка 0/1, поэтому 1 не означает «истина».
Имя взято из внешней структуры, официальное название не подтверждено.
В обоих проанализированных загрузчиках связанный путь отображения (Erase swap on restore) отключён, реального восстановления снимка или стирания swap не обнаружено.
(Частично подтверждено)

"""

[audio_framework]
name = "Буфер аудиофреймворка"
help = """
Имя аудиофреймворка, передаваемое при загрузке как androidboot.audio=<имя>.
Допустимые имена: audioreach, elite и awe, с учётом регистра.
Любое другое значение во время загрузки очищается до пустой строки и сохраняется.
Это не версия аудиопрошивки и не настройка звука.
(Подтверждено)

"""

[fdr_frs_uds_flag]
name = "Состояние FDR/FRS-UDS"
help = """
Флаг запроса на создание нового секрета безопасности после сброса к заводским настройкам (FDR).
Он устанавливается в 1 при обнаружении определённого запроса сброса (--reason=MainClearConfirm), а кэш очищается.
При следующей обработке FRS/UDS Keymint создаёт новый секрет, а загрузчик возвращает флаг в 0.
Загрузчик сбрасывает только значение ровно 1, поэтому при 2 и больше пересоздание может повторяться.
Сам он не стирает userdata, но связан с выводом ключей безопасности.
Это не настройка журналирования IPC.
(Подтверждено)

"""

[reserved_0CA1]
name = "Область выравнивания / резерв"
help = """
3 байта между флагом FDR и длиной кэша, по-видимому, место для выравнивания.
Собственной функции не обнаружено.
(Не подтверждено)

"""

[frs_uds_cache_length]
name = "Длина кэша FRS/UDS"
help = """
Действительная длина кэша секрета безопасности ниже.
Нормальное значение — 32; Keymint отклоняет длины больше 32.
0 означает отсутствие кэша; создавать ли новый секрет, определяют состояние хранилища и флаг FDR вместе.
(Подтверждено)

"""

[frs_uds_cache]
name = "Кэш FRS/UDS (уникален для устройства)"
help = """
Копия 32-байтового секрета безопасности (SECRET), из которого выводится FRS.
Это не сам результат FRS.
Keymint использует полученный из него FRS для шифрования некоторых ключей, поэтому нельзя копировать значение с другого устройства или возвращать старое значение.
Оно может меняться, например при сбросе к заводским настройкам, поэтому это и не постоянный ID устройства.
(Подтверждено. Внутренний смысл — по Keymint TB520FU)

"""

[region_magic_1]
name = "Идентификатор записи региона 1 (магическое значение)"
help = """
Начальный маркер записи региона — ASCII deadbeef.
Загрузчик использует сохранённый регион при проверке, только если совпадают оба маркера; иначе он переходит к созданию записи региона заново.
