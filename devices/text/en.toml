# DeviceInfo field names and help, English, for every device.
#
# [field key] as in devices/<MODEL>/deviceinfo.toml (repeated fields keep {n});
# ["@rollback"] and ["@persistent"] are the two group boxes.
# name = shown name; help = the help window text, line breaks as written.
# Where a device differs, give it its own text: help.<MODEL> = """..."""
# (name.<MODEL> likewise). A field only one device has is shown only there.
# A missing entry falls back to en.toml.

["@rollback"]
help = """
AVB anti-rollback reference values: 32 entries, each a 64-bit integer.
The number is the AVB rollback_index_location, not an A/B slot.
An image whose rollback index is lower than this value gives a rollback error, and whether boot actually stops also depends on the lock state.
The bootloader can raise and store the value during boot.
Even if it looks like a date, it is a security reference value, not a release date.
(Confirmed)

"""

["@persistent"]
help = """
Storage where AVB remembers state between boots: 8 name/value records.
For example, avb.managed_verity_mode is stored here.
AVB can change the contents during boot.
Empty records do not mean AVB is off.
This is a different area from the persist.img partition.
(Confirmed)

"""

[magic]
name = "DeviceInfo magic"
help = """
DeviceInfo format identifier: the 13 bytes ANDROID-BOOT!.
If it differs at boot, the bootloader clears the whole DeviceInfo to 0 and rebuilds the defaults, which also loses the public key, rollback indices, AVB persistent values and region.
It is not a signature or checksum, so a matching value does not mean the rest is valid.
(Confirmed)

"""

[is_unlocked]
name = "Bootloader unlock state"
help = """
0 = bootloader locked
1 = bootloader unlocked

General bootloader lock state.
AVB uses it to decide whether verification errors are allowed, and it is tied to the Fastboot lock display and to flashing and erase limits, so it is a real security decision value.
The official lock change also updates the security state and requests a data wipe, which is not the same as changing only this byte.
(Confirmed)

"""

[is_unlock_critical]
name = "Critical unlock state"
help = """
0 = extra lock kept
1 = unlocked

Extra lock state for critical partitions.
With 0, flashing and erasing partitions classed as critical are refused.
Even with is_unlocked = 1, the critical partition limit stays while this is 0.
(Confirmed)

"""

[charger_screen_enabled]
name = "Charger screen enabled"
help.TB520FU = """
0 = enabled
1 = disabled

Stored off-mode charging policy (off-mode-charge) for when a charger is connected while the tablet is off.
Entering the charging screen also depends on charger detection and other boot requests.
It does not show whether the tablet is charging now.
(Confirmed)

"""
help.TB522FU = """
0 = disabled
1 = enabled

Stored off-mode charging policy (off-mode-charge) for when a charger is connected while the tablet is off.
Entering the charging screen also depends on charger detection and other boot requests.
It does not show whether the tablet is charging now.
(Confirmed)

"""

[bootloader_version]
name = "Bootloader version string"
help = """
Bootloader version string shown by Fastboot version-bootloader.
Changing it does not change the actual bootloader code or security patch level.
It is used as a string, so it must keep a terminating 0 byte at the end.
(Confirmed)

"""

[radio_version]
name = "Radio/baseband version string"
help = """
Radio/baseband version string shown by Fastboot version-baseband.
Changing it does not change the actual modem firmware.
(Confirmed)

"""

[verity_mode]
name = "Verity mode"
help = """
0 = logging
1 = enforcing

Bootloader verity state.
On the AVB2 path a value of 0 adds the "restarted due to hashtree corruption" flag.
The final error handling (restart or EIO) is set together by the AVB persistent value avb.managed_verity_mode and the image settings.
2 or more is not a valid mode and makes the bootloader read past its table (boot color strings).
(Confirmed)

"""

[reserved_0091]
name = "Alignment/reserved"
help = """
The 3 bytes after verity_mode, most likely space that aligns the next 4-byte integer.
No function of its own has been found.
There is no evidence that it is unused and free to change.
(Unconfirmed)

"""

[user_public_key_length]
name = "User public key length"
help = """
Number of valid bytes in the user AVB public key below (at most 2048).
0 means no user key is registered; the manufacturer's built-in keys stay.
It is not an RSA bit size or an algorithm number.
A length that does not match the contents can break the public key trust decision.
(Confirmed)

"""

[user_public_key]
name = "User public key"
help.TB520FU = """
User-registered AVB public key.
The bootloader compares the image's public key with it, length and contents, to decide whether to trust it; if they differ it compares with the manufacturer's built-in keys.
Changing it affects the AVB trust decision.
It is not a private key, so it cannot make signatures on its own.
(Confirmed)

"""
help.TB522FU = """
User-registered AVB public key.
The bootloader compares the image's public key with it, length and contents, to decide whether to trust it; if they differ it compares with the manufacturer's built-in keys.
Changing it affects the AVB trust decision.
It is not a private key, so it cannot make signatures on its own.
(Confirmed. On TB522FU the registration command path is unconfirmed.)

"""

["rollback_index[{n}]"]
name = "Rollback index"
help = """
AVB anti-rollback reference values: 32 entries, each a 64-bit integer.
The number is the AVB rollback_index_location, not an A/B slot.
An image whose rollback index is lower than this value gives a rollback error, and whether boot actually stops also depends on the lock state.
The bootloader can raise and store the value during boot.
Even if it looks like a date, it is a security reference value, not a release date.
(Confirmed)

"""

["persistent[{n}].valid"]
name = "AVB persistent value in use"
help = """
Whether this record is in use.
Only exactly 1 means in use; 2 or more is treated as an empty record.
(Confirmed)

"""

["persistent[{n}].name_length"]
name = "AVB persistent value name length"
help = """
Number of bytes used to compare the name (at most 56).
(Confirmed)

"""

["persistent[{n}].value_length"]
name = "AVB persistent value data length"
help = """
Valid length of the value (at most 32).
(Confirmed)

"""

["persistent[{n}].name"]
name = "AVB persistent value name"
help = """
Record name.
Its range is set by the length field, so it may have no terminating 0 byte.
(Confirmed)

"""

["persistent[{n}].value"]
name = "AVB persistent value data"
help = """
Raw data for the name.
It cannot be read uniformly as a string or an integer.
(Confirmed)

"""

[golden_snapshot]
name = "Golden snapshot (presumed)"
help = """
8-byte value compared with the constant 0x575757.
It is not a 0/1 setting, so 1 does not mean true.
The name comes from an outside structure, and the official name is unconfirmed.
In both analysed bootloaders the related display path (Erase swap on restore) is off, and no actual snapshot restore or swap erase was found.
(Partly confirmed)

"""

[audio_framework]
name = "Audio framework buffer"
help = """
Audio framework name passed at boot as androidboot.audio=<name>.
The allowed names are audioreach, elite and awe, case-sensitive.
Any other value is cleared to an empty string and saved during boot.
It is not an audio firmware version or a sound setting.
(Confirmed)

"""

[fdr_frs_uds_flag]
name = "FDR/FRS-UDS state"
help = """
Request flag to create a new security secret after a factory data reset (FDR).
It is set to 1 when a specific reset request (--reason=MainClearConfirm) is detected, and the cache is cleared.
At the next FRS/UDS step Keymint creates a new secret and the bootloader sets the flag back to 0.
The bootloader clears only exactly 1, so 2 or more can make the regeneration repeat.
It does not erase userdata itself, but it is tied to security key derivation.
It is not an IPC logging setting.
(Confirmed)

"""

[reserved_0CA1]
name = "Alignment/reserved"
help = """
The 3 bytes between the FDR flag and the cache length, most likely alignment space.
No function of its own has been found.
(Unconfirmed)

"""

[frs_uds_cache_length]
name = "FRS/UDS cache length"
help = """
Valid length of the security secret cache below.
The normal value is 32, and Keymint refuses lengths over 32.
0 means there is no cache; whether a new secret is created depends on the storage state and the FDR flag together.
(Confirmed)

"""

[frs_uds_cache]
name = "FRS/UDS cache (device-unique)"
help = """
Copy of the 32-byte security secret (SECRET) used to derive FRS.
It is not the FRS result itself.
Keymint uses the FRS derived from it to encrypt some keys, so never copy another device's value or restore an old value.
It can change, for example with a factory reset, so it is not a fixed device ID.
(Confirmed. Internal meaning based on TB520FU Keymint)

"""

[region_magic_1]
name = "Region record magic 1"
help = """
Start marker of the region record: ASCII deadbeef.
Only when both markers match does the bootloader use the stored region in its check; otherwise it takes the path that creates the region record anew.
It is not a signature or checksum.
(Confirmed)

"""

[region_info_version]
name = "Region record version"
help = """
Region record version.
The normal value is 1; 2 or more is handled as a version mismatch.
(Confirmed)

"""

[oem_reserved_1]
name = "OEM reserved (unidentified)"
help = """
An unconfirmed area inside the logical DeviceInfo.
The function of its individual bytes has not been found.
It is read and saved together when the whole structure or the region record is handled.
There is no evidence that it has no function and can be set to 0.
(Unconfirmed)

"""

[region]
name = "Region"
help.TB520FU = """
Device region: PRC or ROW, 3 bytes.
At boot it is compared with the region in the firmware DTB (region_country); if they differ, the tablet shows an incompatible system notice and stops booting.
It is separate from the country code.
(Confirmed)

"""
help.TB522FU = """
Device region: PRC or ROW, 3 bytes.
At boot it is compared with the region in the firmware DTB (build_region of /product_region); if they differ, the tablet shows an incompatible system notice and stops booting.
It is separate from the country code.
(Confirmed)

"""

[region_fill]
name = "Region zero fill"
help = """
The remaining 13 bytes of the 16-byte region string space after its first 3 bytes.
In a normal state they are all 0.
It is not a separate country code field.
(Confirmed)

"""

[region_magic_2]
name = "Region record magic 2"
help = """
End marker of the region record: ASCII beefdead.
Same role as region_magic_1.
(Confirmed)

"""

[region_reserved]
name = "Region record trailer (unidentified)"
help = """
An unconfirmed area inside the logical DeviceInfo.
The function of its individual bytes has not been found.
It is read and saved together when the whole structure or the region record is handled.
There is no evidence that it has no function and can be set to 0.
(Unconfirmed)

"""

[region_padding]
name = "Region trailer (unidentified)"
help = """
An unconfirmed area inside the logical DeviceInfo.
The function of its individual bytes has not been found.
It is read and saved together when the whole structure or the region record is handled.
There is no evidence that it has no function and can be set to 0.
(Unconfirmed)

"""

[oem_reserved_2]
name = "OEM reserved (unidentified)"
help = """
An unconfirmed area inside the logical DeviceInfo.
The function of its individual bytes has not been found.
It is read and saved together when the whole structure or the region record is handled.
There is no evidence that it has no function and can be set to 0.
(Unconfirmed)

"""

[fastboot_mode]
name = "Fastboot boot mode flag"
help.TB520FU = """
0 = allowed
1 = blocked

Whether entering Fastboot with a key combination at power-on (hotkey) is allowed.
It does not show that the tablet is in Fastboot now, and it is not a request to boot into Fastboot next.
It does not block other ways in, such as a reboot command.
(Confirmed)

"""
help.TB522FU = """
0 = blocked
1 = allowed

Whether entering Fastboot with a key combination at power-on (hotkey) is allowed.
It does not show that the tablet is in Fastboot now, and it is not a request to boot into Fastboot next.
It does not block other ways in, such as a reboot command.
(Confirmed)

"""

[recovery_mode]
name = "Recovery boot mode flag"
help.TB520FU = """
0 = allowed
1 = blocked

Whether entering Recovery with a key combination (hotkey) is allowed.
It is separate from the boot-recovery request in misc, so it does not block every way into Recovery.
(Confirmed)

"""
help.TB522FU = """
0 = blocked
1 = allowed

Whether entering Recovery with a key combination (hotkey) is allowed.
It is separate from the boot-recovery request in misc, so it does not block every way into Recovery.
(Confirmed)

"""

[factory_mode]
name = "Factory boot mode flag"
help.TB520FU = """
Stored value related to factory and diagnostic modes; it is not a factory reset flag.
With 0, the factory mode boot arguments (androidboot.mode=, ffbm-00) are allowed to be passed; another mode request must also be present for them to take effect.
(Confirmed)

"""
help.TB522FU = """
Stored value related to factory and diagnostic modes; it is not a factory reset flag.
Reading and saving it are confirmed, but no effect on entering FFBM has been found.
(Partly confirmed)

"""

[deviceinfo_format_version]
name = "DeviceInfo format version"
help = """
DeviceInfo format version string; the normal value is 1.0.
If it differs, at boot the bootloader rewrites fastboot_mode, recovery_mode and factory_mode all to 1 and corrects the version to 1.0.
It is not for display; it decides three other settings.
(Confirmed)

"""

[reserved_end]
name = "Trailing reserved"
help = """
The unconfirmed 5 bytes at the end of the structure.
No function has been found.
(Unconfirmed)

"""
