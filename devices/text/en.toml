# DeviceInfo field names and help, English, for every device.
#
# [field key] as in devices/<MODEL>/deviceinfo.toml (repeated fields keep {n});
# ["@rollback"] and ["@persistent"] are the two group boxes.
# name = shown name; help = the help window text, line breaks as written.
# Where a device differs, give it its own text: help.<MODEL> = """..."""
# (name.<MODEL> likewise). A field only one device has is shown only there.
# In a repeated field {n} becomes the entry number; ["rollback_index[2]"] gives one entry its own text.
# A missing entry falls back to en.toml.

["@rollback"]
help = """
This area stores the reference values used by AVB (Android Verified Boot) to prevent rollback and consists of 32 8-byte integers.
Each entry number represents an AVB `rollback_index_location`.
If an image's rollback index is lower than the stored reference value, a rollback verification error occurs. Whether boot is actually blocked may depend on whether the bootloader is Locked or Unlocked.
During boot, the bootloader may update rollback indices to higher values and save them.
"""

["@persistent"]
help = """
This is the persistent storage area used by AVB (Android Verified Boot) to retain state information across boots.
It can store a total of 8 records, each consisting of a name and a value.
During boot, AVB may read or modify the stored persistent values as needed.
An empty storage area does not mean that AVB is disabled.

"""

[magic]
name = "DeviceInfo identifier (magic)"
help = """
The DeviceInfo format identifier is the 13-byte string ANDROID-BOOT!.
If this value does not match during boot, the bootloader clears the entire DeviceInfo structure to 0 and recreates it with default values.
This also removes the public key, rollback indices, AVB persistent values, region, and other data.

"""

[is_unlocked]
name = "Bootloader Unlock flag"
help = """
0 = Bootloader Locked
1 = Bootloader Unlocked

This flag indicates whether the bootloader is Locked or Unlocked.
When Locked, boot is blocked if AVB (Android Verified Boot) verification fails. When Unlocked, verification failures are allowed.
When Unlocked, verifiedbootstate changes to Orange, which may lower the security trust level of services such as Play Integrity and Widevine DRM.
Changing this flag causes the bootloader to require a user data reset. Normal boot is not possible unless the reset is performed.

"""

[is_unlock_critical]
name = "Critical Unlock flag"
help = """
0 = Critical Locked
1 = Critical Unlocked

This flag indicates whether critical partitions are Locked or Unlocked.
When Critical Locked, flashing and erasing critical partitions through Fastboot are blocked.
Restrictions on critical partitions remain in place when Critical Locked, even if the bootloader is Unlocked.
Changing this flag causes the bootloader to require a user data reset. Normal boot is not possible unless the reset is performed.

"""

[charger_screen_enabled]
name = "Charging screen display"
help.TB520FU = """
0 = Enabled
1 = Disabled

This setting determines whether the device enters charging-only mode when a charger is connected while the device is powered off.
When enabled, connecting a charger may cause the device to enter charging-only mode, which displays information such as the battery level, instead of booting Android normally, depending on the conditions.
When disabled, the device skips entry into charging-only mode.
This setting does not control charging itself and does not affect charging speed or the charging status display while Android is running.

"""
help.TB522FU = """
0 = Disabled
1 = Enabled

This setting determines whether the device enters charging-only mode when a charger is connected while the device is powered off.
When enabled, connecting a charger may cause the device to enter charging-only mode, which displays information such as the battery level, instead of booting Android normally, depending on the conditions.
When disabled, the device skips entry into charging-only mode.
This setting does not control charging itself and does not affect charging speed or the charging status display while Android is running.

"""

[bootloader_version]
name = "Bootloader version string"
help = """
The bootloader version string displayed by Fastboot as version-bootloader.
Changing this value does not affect the actual bootloader code or security patch level.
The string is stored in null-terminated format, so it must retain a trailing null character (\\0).

"""

[radio_version]
name = "Radio/baseband version string"
help = """
The Radio/Baseband version string displayed by Fastboot as version-baseband.
Changing this value does not affect the actual bootloader code or security patch level.
The string is stored in null-terminated format, so it must retain a trailing null character (\\0).

"""

[verity_mode]
name = "Verity mode"
help = """
0 = logging
1 = enforcing

This value represents the bootloader's Verity state.
In the AVB 2.0 path, a value of 0 sets a flag indicating that the device rebooted due to hashtree corruption.
The final response to a Verity error (reboot or EIO) is determined by AVB's persistent setting (avb.managed_verity_mode) and the image settings.

"""

[reserved_0091]
name = "Reserved area (presumed alignment padding)"
help = """
This 3-byte area follows verity_mode and is presumed to provide alignment padding for the next 4-byte integer field.
No independent function or purpose has been identified for this area.
It cannot be assumed to be unused, so changing its values arbitrarily is not recommended.

"""

[user_public_key_length]
name = "User public key length"
help = """
The length, in bytes, of the valid data in the user-registered AVB public key. (Maximum: 2048 bytes)
A value of 0 means no user public key is registered and does not affect the manufacturer's built-in public key.
This value specifies the length of the public key data, not the RSA key size in bits or an encryption algorithm identifier.
If the specified length does not match the actual public key data, public key verification and trust evaluation may fail.

"""

[user_public_key]
name = "Custom AVB public key"
help.TB520FU = """
Custom AVB (Android Verified Boot) public key data.
The bootloader determines whether to trust the image's public key by comparing its length and contents with the registered user public key.
If it does not match the user public key, additional verification is performed against the manufacturer's built-in public key.
When AVB verification uses a custom AVB public key while Locked, verifiedbootstate changes to Yellow, which may lower the security trust level of services such as Play Integrity and Widevine DRM.

"""
help.TB522FU = """
Custom AVB (Android Verified Boot) public key data.
The bootloader determines whether to trust the image's public key by comparing its length and contents with the registered user public key.
If it does not match the user public key, additional verification is performed against the manufacturer's built-in public key.
When AVB verification uses a custom AVB public key while Locked, verifiedbootstate changes to Yellow, which may lower the security trust level of services such as Play Integrity and Widevine DRM.
(The TB522FU model does not provide an official method for registering a user AVB public key.)

"""

["rollback_index[{n}]"]
name = "Rollback index (unused)"
help = """
Rollback Index Location: {n} - Unused

Rollback indices can only be entered in decimal, with a maximum of 10 digits.
The entered value is converted to an 8-byte integer and stored in little-endian format.
"""

["rollback_index[0]"]
name = "Rollback index (vbmeta)"
help = """
Rollback Index Location: 0 - vbmeta

Rollback indices can only be entered in decimal, with a maximum of 10 digits.
The entered value is converted to an 8-byte integer and stored in little-endian format.
"""

["rollback_index[1]"]
name = "Rollback index (recovery)"
help = """
Rollback Index Location: 1 - recovery

Rollback indices can only be entered in decimal, with a maximum of 10 digits.
The entered value is converted to an 8-byte integer and stored in little-endian format.
"""

["rollback_index[2]"]
name = "Rollback index (vbmeta_system)"
help = """
Rollback Index Location: 2 - vbmeta_system

Rollback indices can only be entered in decimal, with a maximum of 10 digits.
The entered value is converted to an 8-byte integer and stored in little-endian format.
"""

["rollback_index[3]"]
name = "Rollback index (boot)"
help = """
Rollback Index Location: 3 - boot

Rollback indices can only be entered in decimal, with a maximum of 10 digits.
The entered value is converted to an 8-byte integer and stored in little-endian format.
"""

["persistent[{n}].valid"]
name = "AVB persistent value usage"
help = """
0 = Unused
1 = In use

This flag indicates whether the AVB persistent value record is in use.
A value of 1 identifies a valid record that is used.
A value of 0 or 2 or higher identifies a record that is not used.

"""

["persistent[{n}].name_length"]
name = "AVB persistent value name length"
help = """
The length, in bytes, of the valid name data used when comparing AVB persistent value names. (Maximum: 56 bytes)
This value specifies the number of bytes used for name comparison.
If the specified length does not match the actual name data, the persistent value may not be identified correctly.

"""

["persistent[{n}].value_length"]
name = "AVB persistent value data length"
help = """
The length, in bytes, of the valid data stored in the AVB persistent value. (Maximum: 32 bytes)
This value specifies the number of bytes used as actual data.
If the specified length does not match the actual data, the persistent value may not be read or processed correctly.

"""

["persistent[{n}].name"]
name = "AVB persistent value name"
help = """
The name data used to identify an AVB persistent value entry.
The valid name length is determined by the number of bytes specified in the `name_length` field.
Because a separate length field defines the data range, the string may not include a trailing null character (`\\0`).

"""

["persistent[{n}].value"]
name = "AVB persistent value data"
help = """
The raw data stored under the corresponding AVB persistent value name.
The valid data length is determined by the number of bytes specified in the `value_length` field.
The format and meaning of the stored data depend on the name and purpose of the persistent value.
The data cannot all be interpreted as strings or integers. Changing a value without considering its data format may affect AVB operation.

"""

[golden_snapshot]
name = "Golden snapshot (presumed)"
help = """
An 8-byte integer whose state is evaluated by comparison with a specific constant (`0x575757`).
This value is not a simple enable/disable flag; entering `1` does not cause it to be treated as enabled.
The name `golden_snapshot` comes from an external structure. The official field name and exact purpose have not been confirmed.
In the analyzed bootloaders, the related `Erase swap on restore` display path is disabled. A connection to actual snapshot restoration or swap data erasure has not been confirmed.
Since the exact behavior and the effects of changing the value are unknown, changing it arbitrarily is not recommended.

"""

[audio_framework]
name = "Audio framework buffer"
help = """
This area stores the audio framework name passed to Android through the `androidboot.audio` parameter during boot.
The allowed values are `audioreach`, `elite`, and `awe`. They are case-sensitive.
If an unsupported value is entered, it is reset to an empty string and saved during boot.
This value identifies the audio framework; it does not adjust the audio firmware version or sound quality.

"""

[fdr_frs_uds_flag]
name = "FDR/FRS-UDS state"
help = """
This flag requests an update to the FRS-related security secret when a specific Recovery factory reset request is detected.
When a specific reset request (`--reason=MainClearConfirm`) is detected, this value is set to 1 and the related cache is cleared.
If the subsequent FRS/UDS processing succeeds, the bootloader resets the flag to 0 only when it is exactly 1 and saves the cache received in the response.
The bootloader clears the flag only when it is exactly 1, so if a value of 2 or higher remains, the security secret regeneration process may repeat.
This flag does not directly erase user data (Userdata), but it is related to security key derivation, so changing it arbitrarily is not recommended.

"""

[reserved_0CA1]
name = "Reserved area (presumed alignment padding)"
help = """
This 3-byte area lies between the FDR flag and the cache length field and is presumed to be padding for memory alignment.
No independent function or exact purpose has been identified for this area.
It cannot be assumed to be unused, so changing its values arbitrarily is not recommended.

"""

[frs_uds_cache_length]
name = "FRS/UDS cache length"
help = """
The length, in bytes, of the valid data stored in the FRS/UDS security secret cache.
The normal cache data length is 32 bytes. KeyMint rejects values greater than 32 bytes.
A value of 0 means no cache data is stored.
Whether a new security secret is generated depends on the storage state and the FDR flag, not just the cache length.
Changing this value arbitrarily may interfere with the correct processing of the security secret.

"""

[frs_uds_cache]
name = "FRS/UDS cache (device-specific)"
help = """
This area stores a copy of the 32-byte security secret (SECRET) used to derive FRS.
This is the original secret used for FRS derivation, not the derived FRS value itself.
The FRS derived from this value is used to protect some of KeyMint's cryptographic keys.
Copying a value from another device or restoring a previous value may prevent existing cryptographic keys from being used correctly.
The value may change during operations such as a factory reset, so it is not a permanently fixed device identifier (Device ID).
This value is directly related to security key derivation and encrypted data protection, so changing it arbitrarily is not recommended.

"""

[region_magic_1]
name = "Region record identifier 1 (magic)"
help.TB520FU = """
This marker identifies the start of the region record and contains the ASCII string `deadbeef`.
Both region identifiers must match for the bootloader to consider the stored region information valid and use it for verification.
If either identifier does not match, the bootloader does not use the existing region information and enters the path that creates a new region record.
This value is a fixed record identifier, not a signature or checksum that verifies data integrity.
Changing this value arbitrarily may cause the existing region information to be treated as invalid.

"""

help.TB522FU = """
This marker identifies the start of the region record and contains the ASCII string `deadbeef`.
Both region identifiers must match for the bootloader to consider the stored region information valid and use it for verification.
If only one identifier matches, the information is considered corrupted and boot is refused. If neither matches, region information is recreated only when the boot state is green at the time of the call.
This value is a fixed record identifier, not a signature or checksum that verifies data integrity.
Changing this value arbitrarily may cause the existing region information to be treated as invalid.

"""

[region_info_version]
name = "Region record version"
help = """
The data structure version of the region record.
The normal version value is 1, which the bootloader uses to determine the validity of the record.
A value of 2 or higher is considered an unsupported version and results in a version mismatch error.
Changing this value arbitrarily may prevent the region information from being recognized correctly.

"""

[oem_reserved_1]
name = "OEM reserved area (purpose unknown)"
help = """
A reserved area within the logical DeviceInfo structure. Its exact purpose has not been identified.
The functions or roles of individual bytes in this area have not been identified.
This area is processed together with the rest of the data when the entire DeviceInfo structure or a region record is read or saved.
Even though no separate function has been identified, this area cannot be assumed to be unused. Changing its values arbitrarily or resetting them to 0 is not recommended.

"""

[region]
name = "Region"
help.TB520FU = """
A 3-byte string representing the device's region, containing either `PRC` or `ROW`.
During boot, the bootloader checks compatibility by comparing this value with the region information (`region_country`) in the firmware DTB.
If the two values do not match, an "Incompatible system" message is displayed and boot stops.
This value is managed separately from the device's country code and is used to determine region compatibility with the firmware.
Changing this value arbitrarily may prevent normal boot due to a region mismatch with the firmware.

"""
help.TB522FU = """
A 3-byte string representing the device's region, containing either `PRC` or `ROW`.
During boot, the bootloader checks compatibility by comparing this value with the region information (the `build_region` property of the `/product_region` node) in the firmware DTB.
If the two values do not match, an "Incompatible system" message is displayed and boot stops.
This value is managed separately from the device's country code and is used to determine region compatibility with the firmware.
Changing this value arbitrarily may prevent normal boot due to a region mismatch with the firmware.

"""

[region_fill]
name = "Region string padding area"
help = """
The remaining 13 bytes of the 16-byte region string area, excluding the first 3 bytes that store the actual region value.
Under normal conditions, all bytes in this area are filled with 0.
This is padding for the unused space in the region string, not a field that stores a separate country code or region information.
Changing its values arbitrarily is not recommended, to maintain consistency of the data structure.

"""

[region_magic_2]
name = "Region record identifier 2 (Magic)"
help.TB520FU = """
This marker identifies the start of the region record and contains the ASCII string `deadbeef`.
Both region identifiers must match for the bootloader to consider the stored region information valid and use it for verification.
If either identifier does not match, the bootloader does not use the existing region information and enters the path that creates a new region record.
This value is a fixed record identifier, not a signature or checksum that verifies data integrity.
Changing this value arbitrarily may cause the existing region information to be treated as invalid.

"""

help.TB522FU = """
This marker identifies the start of the region record and contains the ASCII string `deadbeef`.
Both region identifiers must match for the bootloader to consider the stored region information valid and use it for verification.
If only one identifier matches, the information is considered corrupted and boot is refused. If neither matches, region information is recreated only when the boot state is green at the time of the call.
This value is a fixed record identifier, not a signature or checksum that verifies data integrity.
Changing this value arbitrarily may cause the existing region information to be treated as invalid.

"""

[region_reserved]
name = "Region record reserved area (purpose unknown)"
help = """
A reserved area at the end of the region record in the logical DeviceInfo structure. Its exact purpose has not been identified.
The functions or roles of individual bytes in this area have not been identified.
This area is processed together with the rest of the data when the entire DeviceInfo structure or a region record is read or saved.
Even though no separate function has been identified, this area cannot be assumed to be unused. Changing its values arbitrarily or resetting them to 0 is not recommended.

"""

[region_padding]
name = "Region data padding area (purpose unknown)"
help = """
An area at the end of the region data in the logical DeviceInfo structure. Its exact purpose has not been identified.
The functions or roles of individual bytes in this area have not been identified.
This area is processed together with the rest of the data when the entire DeviceInfo structure or a region record is read or saved.
Although classified as padding, it has not been confirmed whether this area serves only to align memory.
This area cannot be assumed to be unused, so changing its values arbitrarily or resetting them to 0 is not recommended.

"""

[oem_reserved_2]
name = "OEM reserved area (purpose unknown)"
help = """
An OEM reserved area within the logical DeviceInfo structure. Its exact purpose has not been identified.
The functions or roles of individual bytes in this area have not been identified.
This area is processed together with the rest of the data when the entire DeviceInfo structure or a region record is read or saved.
Even though no separate function has been identified, this area cannot be assumed to be unused. Changing its values arbitrarily or resetting them to 0 is not recommended.

"""

[fastboot_mode]
name = "Fastboot hotkey entry restriction"
help.TB520FU = """
0 = Allowed
1 = Blocked

This flag allows or blocks entry into Fastboot mode through specific key combinations (hotkeys) at power-on.
A value of 0 allows entry into Fastboot mode through hotkeys.
A value of 1 blocks entry into Fastboot mode through hotkeys.
This value does not indicate whether the device is currently in Fastboot mode and does not select Fastboot mode for the next boot.
It does not affect entry into Fastboot mode through other paths, such as reboot commands.

"""
help.TB522FU = """
0 = Blocked
1 = Allowed

This flag allows or blocks entry into Fastboot mode through specific key combinations (hotkeys) at power-on.
A value of 1 allows entry into Fastboot mode through hotkeys.
A value of 0 blocks entry into Fastboot mode through hotkeys.
This value does not indicate whether the device is currently in Fastboot mode and does not select Fastboot mode for the next boot.
It does not affect entry into Fastboot mode through other paths, such as reboot commands.

"""

[recovery_mode]
name = "Recovery hotkey entry restriction"
help.TB520FU = """
0 = Allowed
1 = Blocked

This flag allows or blocks entry into Recovery mode through specific key combinations (hotkeys) at power-on.
A value of 0 allows entry into Recovery mode through hotkeys.
A value of 1 blocks entry into Recovery mode through hotkeys.
This value does not indicate whether the device is currently in Recovery mode and does not select Recovery mode for the next boot.
It does not affect entry into Recovery mode through other paths, such as reboot commands.

"""
help.TB522FU = """
0 = Blocked
1 = Allowed

This flag allows or blocks entry into Recovery mode through specific key combinations (hotkeys) at power-on.
A value of 1 allows entry into Recovery mode through hotkeys.
A value of 0 blocks entry into Recovery mode through hotkeys.
This value does not indicate whether the device is currently in Recovery mode and does not select Recovery mode for the next boot.
It does not affect entry into Recovery mode through other paths, such as reboot commands.

"""

[factory_mode]
name = "Factory mode boot flag"
help.TB520FU = """
0 = Allowed
1 = Blocked

This flag allows or restricts certain boot operations related to Factory mode.
A value of 0 allows the Factory mode string to be passed as the androidboot.mode= boot argument and allows the boot menu path that prepares ffbm-00.
A value of 1 skips these processing paths. This setting does not block all entry paths into Factory and diagnostic modes.
This value alone does not cause entry into Factory mode; a separate boot mode request is also required.
This flag does not perform a factory reset (FDR) or erase user data.

"""

help.TB522FU = """
0 = Blocked
1 = Allowed

A setting related to Factory mode.
It is used by Fastboot to query and change factory-mode and returns the stored 0 or 1 unchanged.
The paths that initialize DeviceInfo or repair its format version set this value to 1.
However, no check using this value to allow or block processing has been identified in the FFBM menu handling or the androidboot.mode= boot argument construction paths.
Therefore, it cannot be concluded that setting 0 or 1 actually allows or blocks booting into Factory mode.
This flag does not perform a factory reset (FDR) or erase user data.

"""

[deviceinfo_format_version]
name = "DeviceInfo format version"
help = """
A string representing the format version of the DeviceInfo data structure. The normal value is `1.0`.
During boot, the bootloader checks this value to determine whether the DeviceInfo format is valid.
If the value does not match `1.0`, the `fastboot_mode`, `recovery_mode`, and `factory_mode` flags are all reset to 1, and the format version is restored to `1.0`.
This is not merely a version display string; it determines whether the other three boot mode settings are reset.
Changing this value arbitrarily may cause the related boot mode settings to change automatically.


"""

[reserved_end]
name = "Trailing reserved area (purpose unknown)"
help = """
A 5-byte reserved area at the end of the DeviceInfo structure. Its exact purpose has not been identified.
The functions or roles of individual bytes in this area have not been identified.
This area cannot be assumed to be unused, so changing its values arbitrarily or resetting them to 0 is not recommended.


"""
