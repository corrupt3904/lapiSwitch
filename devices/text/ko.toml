# DeviceInfo field names and help, 한국어, for every device.
#
# [field key] as in devices/<MODEL>/deviceinfo.toml (repeated fields keep {n});
# ["@rollback"] and ["@persistent"] are the two group boxes.
# name = shown name; help = the help window text, line breaks as written.
# Where a device differs, give it its own text: help.<MODEL> = """..."""
# (name.<MODEL> likewise). A field only one device has is shown only there.
# In a repeated field {n} becomes the entry number; ["rollback_index[2]"] gives one entry its own text.
# A missing entry falls back to en.toml.

["@rollback"]
help = """
AVB(Android Verified Boot)의 롤백 방지를 위한 기준값을 저장하는 영역으로, 총 32개의 8바이트 정수로 구성됩니다.
각 항목의 번호는 AVB의 `rollback_index_location`을 나타냅니다.
이미지의 롤백 인덱스가 저장된 기준값보다 낮을 경우 롤백 검증 오류가 발생하며, 실제 부팅 차단 여부는 부트로더의 Locked/Unlocked 상태에 따라 달라질 수 있습니다.
부팅 과정에서 부트로더가 롤백 인덱스를 더 높은 값으로 갱신하여 저장할 수 있습니다.
"""

["@persistent"]
help = """
AVB(Android Verified Boot)가 부팅 간 상태 정보를 유지하기 위해 사용하는 영속 저장 영역(Persistent Storage)입니다.
총 8개의 이름(Name)과 값(Value)으로 구성된 레코드를 저장할 수 있습니다.
부팅 과정에서 AVB가 필요에 따라 저장된 영속값을 읽거나 변경할 수 있습니다.
해당 영역에 저장된 데이터가 없더라도 AVB 기능이 비활성화된 것을 의미하지는 않습니다.

"""

[magic]
name = "DeviceInfo 식별 값(magic)"
help = """
DeviceInfo 형식 식별자로, ANDROID-BOOT! 13바이트입니다.
부팅 시 이 값이 다르면 부트로더가 DeviceInfo 전체를 0으로 지우고 기본값으로 다시 만듭니다.
이때 공개키, 롤백 인덱스, AVB 영속 값, 리전 등이 함께 사라집니다.

"""

[is_unlocked]
name = "부트로더 Unlock 플래그"
help = """
0 = 부트로더 Locked
1 = 부트로더 Unlocked

부트로더의 Locked/Unlocked 상태를 나타내는 플래그입니다.
Locked 상태에서는 AVB(Android Verified Boot) 검증에 실패할 경우 부팅이 차단되지만, Unlocked 상태에서는 검증 실패가 허용됩니다.
Unlocked 상태에서는 verifiedbootstate가 Orange로 변경되며, 이에 따라 Play Integrity 및 Widevine DRM 등의 보안 신뢰 수준이 낮아질 수 있습니다.
해당 플래그를 변경하면 부트로더에서 사용자 데이터 초기화를 요구하며, 초기화를 수행하지 않을 경우 정상적인 부팅이 불가능합니다.

"""

[is_unlock_critical]
name = "Critical Unlock 플래그"
help = """
0 = Critical Locked
1 = Critical Unlocked

중요 파티션에 대한 Locked/Unlocked 상태를 나타내는 플래그입니다.
Critical Locked 상태에서는 Fastboot를 통한 중요 파티션의 플래싱 및 삭제가 차단됩니다.
부트로더가 Unlocked 상태이더라도 Critical Locked 상태라면 중요 파티션에 대한 작업 제한은 유지됩니다.
해당 플래그를 변경하면 부트로더에서 사용자 데이터 초기화를 요구하며, 초기화를 수행하지 않을 경우 정상적인 부팅이 불가능합니다.

"""

[charger_screen_enabled]
name = "충전 화면 표시 여부"
help.TB520FU = """
0 = 활성화
1 = 비활성화

전원이 꺼진 상태에서 충전기를 연결했을 때 충전 전용 모드로 진입할지 여부를 설정하는 값입니다.
활성화 상태에서는 충전기 연결 시 조건에 따라 일반 Android 부팅 대신 배터리 잔량 등을 표시하는 충전 전용 모드로 진입합니다.
비활성화 상태에서는 충전 전용 모드로 진입하는 과정을 건너뜁니다.
해당 설정은 충전 기능 자체를 제어하는 것이 아니며, 충전 속도나 Android 실행 중의 충전 상태 표시에는 영향을 주지 않습니다.

"""
help.TB522FU = """
0 = 비활성화
1 = 활성화

전원이 꺼진 상태에서 충전기를 연결했을 때 충전 전용 모드로 진입할지 여부를 설정하는 값입니다.
활성화 상태에서는 충전기 연결 시 조건에 따라 일반 Android 부팅 대신 배터리 잔량 등을 표시하는 충전 전용 모드로 진입합니다.
비활성화 상태에서는 충전 전용 모드로 진입하는 과정을 건너뜁니다.
해당 설정은 충전 기능 자체를 제어하는 것이 아니며, 충전 속도나 Android 실행 중의 충전 상태 표시에는 영향을 주지 않습니다.

"""

[bootloader_version]
name = "부트로더 버전 문자열"
help = """
Fastboot의 version-bootloader로 표시되는 부트로더 버전 문자열입니다.
해당 값을 변경하더라도 실제 부트로더 코드나 보안 패치 수준에는 영향을 주지 않습니다.
문자열은 Null 종료 형식(Null-terminated string)으로 저장되므로, 끝에 Null 문자(\\0)가 포함된 형태를 유지해야 합니다.

"""

[radio_version]
name = "라디오/베이스밴드 버전 문자열"
help = """
Fastboot의 version-baseband로 표시되는 Radio/Baseband 버전 문자열입니다.
해당 값을 변경하더라도 실제 부트로더 코드나 보안 패치 수준에는 영향을 주지 않습니다.
문자열은 Null 종료 형식(Null-terminated string)으로 저장되므로, 끝에 Null 문자(\\0)가 포함된 형태를 유지해야 합니다.

"""

[verity_mode]
name = "verity 모드"
help = """
0 = logging
1 = enforcing

부트로더의 Verity 상태를 나타내는 값입니다.
AVB 2.0 경로에서는 해당 값이 0일 경우, Hashtree 손상으로 인해 재부팅되었음을 나타내는 플래그가 설정됩니다.
Verity 오류 발생 시 최종 처리 방식(재부팅 또는 EIO)은 AVB의 영속 설정 값(avb.managed_verity_mode)과 이미지 설정에 따라 결정됩니다.

"""

[reserved_0091]
name = "예약 영역 (정렬 패딩 추정)"
help = """
verity_mode 필드 뒤에 위치한 3바이트 영역으로, 다음 4바이트 정수 필드의 메모리 정렬(Alignment)을 위한 패딩(Padding) 공간으로 추정됩니다.
해당 영역의 독립적인 기능이나 용도는 확인되지 않았습니다.
사용되지 않는 영역이라고 단정할 수 없으므로, 임의로 값을 변경하는 것은 권장하지 않습니다.

"""

[user_public_key_length]
name = "사용자 공개키 길이"
help = """
사용자가 등록한 AVB 공개키의 유효 데이터 길이를 바이트 단위로 나타내는 값입니다. (최대 2048바이트)
값이 0이면 사용자 공개키가 등록되지 않은 상태를 의미하며, 제조사 내장 공개키에는 영향을 주지 않습니다.
해당 값은 공개키 데이터의 길이를 나타내며, RSA 키의 비트 수나 암호화 알고리즘 식별자를 의미하지 않습니다.
지정된 길이와 실제 공개키 데이터가 일치하지 않을 경우, 공개키 검증 및 신뢰 판단에 문제가 발생할 수 있습니다.

"""

[user_public_key]
name = "사용자 지정 AVB 공개키"
help.TB520FU = """
사용자 지정 AVB(Android Verified Boot) 공개키 데이터입니다.
부트로더는 이미지의 공개키와 등록된 사용자 공개키의 길이 및 내용을 비교하여 신뢰 여부를 판단합니다.
사용자 공개키와 일치하지 않을 경우, 제조사 내장 공개키를 기준으로 추가 검증을 수행합니다.
Locked 상태에서 사용자 지정 AVB 공개키를 통해 AVB 검증이 이루어지는 경우, verifiedbootstate가 Yellow로 변경되며, 이에 따라 Play Integrity 및 Widevine DRM 등의 보안 신뢰 수준이 낮아질 수 있습니다.

"""
help.TB522FU = """
사용자 지정 AVB(Android Verified Boot) 공개키 데이터입니다.
부트로더는 이미지의 공개키와 등록된 사용자 공개키의 길이 및 내용을 비교하여 신뢰 여부를 판단합니다.
사용자 공개키와 일치하지 않을 경우, 제조사 내장 공개키를 기준으로 추가 검증을 수행합니다.
Locked 상태에서 사용자 지정 AVB 공개키를 통해 AVB 검증이 이루어지는 경우, verifiedbootstate가 Yellow로 변경되며, 이에 따라 Play Integrity 및 Widevine DRM 등의 보안 신뢰 수준이 낮아질 수 있습니다.
(TB522FU 모델에서는 사용자 AVB 공개키를 등록할 수 있는 공식적인 방법이 제공되지 않습니다.)

"""

["rollback_index[{n}]"]
name = "롤백 인덱스 (미사용)"
help = """
Rollback Index Location: {n} - 미사용

롤백 인덱스는 10진수로만 입력할 수 있으며, 최대 10자리까지 허용됩니다.
입력된 값은 8바이트 정수로 변환되어 리틀 엔디언(Little-endian) 형식으로 저장됩니다.
"""

["rollback_index[0]"]
name = "롤백 인덱스 (vbmeta)"
help = """
Rollback Index Location: 0 - vbmeta

롤백 인덱스는 10진수로만 입력할 수 있으며, 최대 10자리까지 허용됩니다.
입력된 값은 8바이트 정수로 변환되어 리틀 엔디언(Little-endian) 형식으로 저장됩니다.
"""

["rollback_index[1]"]
name = "롤백 인덱스 (recovery)"
help = """
Rollback Index Location: 1 - recovery

롤백 인덱스는 10진수로만 입력할 수 있으며, 최대 10자리까지 허용됩니다.
입력된 값은 8바이트 정수로 변환되어 리틀 엔디언(Little-endian) 형식으로 저장됩니다.
"""

["rollback_index[2]"]
name = "롤백 인덱스 (vbmeta_system)"
help = """
Rollback Index Location: 2 - vbmeta_system

롤백 인덱스는 10진수로만 입력할 수 있으며, 최대 10자리까지 허용됩니다.
입력된 값은 8바이트 정수로 변환되어 리틀 엔디언(Little-endian) 형식으로 저장됩니다.
"""

["rollback_index[3]"]
name = "롤백 인덱스 (boot)"
help = """
Rollback Index Location: 3 - boot

롤백 인덱스는 10진수로만 입력할 수 있으며, 최대 10자리까지 허용됩니다.
입력된 값은 8바이트 정수로 변환되어 리틀 엔디언(Little-endian) 형식으로 저장됩니다.
"""

["persistent[{n}].valid"]
name = "AVB 영속값 사용 여부"
help = """
0 = 미사용
1 = 사용

해당 AVB 영속값(Persistent Value) 레코드의 사용 여부를 나타내는 플래그입니다.
값이 1이면 유효한 레코드로 판단하여 사용합니다.
값이 0이거나 2 이상이면 사용되지 않는 레코드로 취급합니다.

"""

["persistent[{n}].name_length"]
name = "AVB 영속값 이름 길이"
help = """
AVB 영속값(Persistent Value)의 이름을 비교할 때 사용하는 유효 데이터 길이를 바이트 단위로 나타내는 값입니다. (최대 56바이트)
해당 값은 이름 비교에 사용되는 바이트 수를 지정합니다.
지정된 길이와 실제 이름 데이터가 일치하지 않을 경우, 영속값을 정상적으로 식별하지 못할 수 있습니다.

"""

["persistent[{n}].value_length"]
name = "AVB 영속값 데이터 길이"
help = """
AVB 영속값(Persistent Value)에 저장된 데이터의 유효 길이를 바이트 단위로 나타내는 값입니다. (최대 32바이트)
해당 값은 실제 데이터로 사용되는 바이트 수를 지정합니다.
지정된 길이와 실제 데이터가 일치하지 않을 경우, 영속값을 정상적으로 읽거나 처리하지 못할 수 있습니다.

"""

["persistent[{n}].name"]
name = "AVB 영속값 이름"
help = """
AVB 영속값(Persistent Value)의 항목을 식별하는 데 사용되는 이름 데이터입니다.
이름의 유효 길이는 `name_length` 필드에 지정된 바이트 수를 기준으로 결정됩니다.
별도의 길이 필드로 데이터 범위를 구분하므로, 문자열 끝에 Null 종료 문자(`\\0`)가 포함되지 않을 수 있습니다.

"""

["persistent[{n}].value"]
name = "AVB 영속값 데이터"
help = """
AVB 영속값(Persistent Value)의 이름에 대응하여 저장되는 원시 데이터입니다.
데이터의 유효 길이는 `value_length` 필드에 지정된 바이트 수를 기준으로 결정됩니다.
저장된 데이터의 형식과 의미는 해당 영속값의 이름 및 용도에 따라 달라집니다.
모든 데이터를 문자열이나 정수로 일괄 해석할 수 없으며, 데이터 형식을 고려하지 않고 값을 변경할 경우 AVB 동작에 영향을 줄 수 있습니다.

"""

[golden_snapshot]
name = "golden snapshot (추정)"
help = """
특정 상수(`0x575757`)와 비교하여 상태를 판단하는 8바이트 정수 값입니다.
해당 값은 단순한 활성화/비활성화 플래그가 아니며, `1`을 입력하더라도 활성화 상태로 처리되지 않습니다.
`golden_snapshot`이라는 명칭은 외부 구조체를 기반으로 한 것으로, 공식적인 필드 명칭이나 정확한 용도는 확인되지 않았습니다.
분석된 부트로더에서는 관련 표시 경로인 `Erase swap on restore`가 비활성화되어 있으며, 실제 스냅샷 복원이나 Swap 데이터 삭제 기능과의 연관성은 확인되지 않았습니다.
정확한 동작과 변경 시 영향을 확인할 수 없으므로, 임의로 값을 변경하는 것은 권장하지 않습니다.

"""

[audio_framework]
name = "오디오 프레임워크 버퍼"
help = """
부팅 시 `androidboot.audio` 파라미터를 통해 Android에 전달되는 오디오 프레임워크 이름을 저장하는 영역입니다.
허용되는 값은 `audioreach`, `elite`, `awe`이며, 대소문자를 구분합니다.
허용되지 않은 값을 입력하면 부팅 과정에서 빈 문자열로 초기화되어 저장됩니다.
해당 값은 오디오 프레임워크의 식별에 사용되며, 오디오 펌웨어 버전이나 음질을 조정하는 설정은 아닙니다.

"""

[fdr_frs_uds_flag]
name = "FDR/FRS-UDS 상태"
help = """
특정 Recovery 공장초기화 요청이 감지됐을 때, FRS 관련 보안 비밀값의 갱신을 요청하는 플래그입니다.
특정 초기화 요청(`--reason=MainClearConfirm`)이 감지되면 해당 값이 1로 설정되며, 관련 캐시가 초기화됩니다.
이후 관련 FRS/UDS 처리가 성공하면, 부트로더는 플래그가 정확히 1인 경우에만 0으로 되돌리고 응답으로 받은 캐시를 저장합니다.
부트로더는 값이 정확히 1인 경우에만 초기화하므로, 2 이상의 값이 유지되면 보안 비밀값의 재생성 과정이 반복될 수 있습니다.
해당 플래그는 사용자 데이터(Userdata)를 직접 삭제하지 않지만, 보안 키 파생 과정과 연관되어 있어 임의로 변경하는 것은 권장하지 않습니다.

"""

