해당 값은 현재 Recovery 모드 진입 여부를 나타내거나, 다음 부팅을 Recovery 모드로 지정하는 설정이 아닙니다.
재부팅 명령 등 다른 경로를 통한 Recovery 모드 진입에는 영향을 주지 않습니다.

"""

[factory_mode]
name = "공장 모드(Factory) 부팅 플래그"
help.TB520FU = """
0 = 허용
1 = 차단

공장(Factory) 모드와 관련된 일부 부팅 처리를 허용하거나 제한하는 플래그입니다.
값이 0이면 공장 모드 문자열을 androidboot.mode= 부팅 인자로 전달하는 처리와, 부팅 메뉴에서 ffbm-00을 준비하는 경로가 허용됩니다.
값이 1이면 해당 처리 경로를 건너뜁니다. 모든 공장·진단 모드 진입 경로를 일괄적으로 차단하는 설정은 아닙니다.
해당 값만으로 공장 모드에 진입하는 것은 아니며, 별도의 부팅 모드 요청이 함께 있어야 동작합니다.
공장 초기화(FDR)를 실행하거나 사용자 데이터를 삭제하는 플래그는 아닙니다.

"""

help.TB522FU = """
0 = 차단
1 = 허용

공장(Factory) 모드 관련 설정값입니다.
Fastboot의 factory-mode 조회 및 변경 처리에서 사용되며, 저장된 0 또는 1을 그대로 반환합니다.
DeviceInfo를 새로 초기화하거나 형식 버전을 복구하는 경로에서는 이 값을 1로 설정합니다.
다만, FFBM 메뉴 처리와 androidboot.mode= 부팅 인자 구성 경로에서는 이 값으로 처리를 허용하거나 차단하는 검사가 확인되지 않았습니다.
따라서 0 또는 1을 설정했을 때 실제 공장 모드 부팅이 허용되거나 차단된다고 단정할 수 없습니다.
공장 초기화(FDR)를 실행하거나 사용자 데이터를 삭제하는 플래그는 아닙니다.

"""

[deviceinfo_format_version]
name = "DeviceInfo 형식 버전"
help = """
DeviceInfo 데이터 구조의 형식 버전을 나타내는 문자열로, 정상값은 `1.0`입니다.
부팅 과정에서 부트로더는 해당 값을 확인하여 DeviceInfo 형식의 유효성을 판단합니다.
값이 `1.0`과 일치하지 않을 경우, `fastboot_mode`, `recovery_mode`, `factory_mode` 플래그를 모두 1로 재설정하고 형식 버전을 `1.0`으로 복원합니다.
단순한 버전 표시용 문자열이 아니라, 다른 세 가지 부팅 모드 설정의 초기화 여부를 결정하는 기준값입니다.
해당 값을 임의로 변경할 경우 관련 부팅 모드 설정이 자동으로 변경될 수 있으므로 주의가 필요합니다.


"""

[reserved_end]
name = "끝부분 예약 영역 (용도 미확인)"
help = """
DeviceInfo 구조체의 끝부분에 위치한 5바이트 예약 영역으로, 정확한 용도는 확인되지 않았습니다.
해당 영역의 개별 바이트가 수행하는 기능이나 역할은 확인되지 않았습니다.
사용되지 않는 영역이라고 단정할 수 없으므로, 임의로 값을 변경하거나 0으로 초기화하는 것은 권장하지 않습니다.


"""
