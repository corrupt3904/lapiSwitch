[region_fill]
name = "区域字符串填充区"
help = """
在 16 字节的区域（Region）字符串空间中，除去保存实际区域值的前 3 字节后，剩余的 13 字节区域。
正常情况下，此区域的所有字节均填充为 0。
此区域用于填充区域字符串的剩余空间（Padding），并非保存其他国家代码或区域信息的字段。
为保持数据结构的一致性，不建议随意修改其值。

"""

