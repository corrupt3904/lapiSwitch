[deviceinfo_format_version]
name = "DeviceInfo 格式版本"
help = """
表示 DeviceInfo 数据结构格式版本的字符串，正常值为 `1.0`。
启动过程中，引导加载程序会检查此值，以判断 DeviceInfo 格式是否有效。
如果此值与 `1.0` 不匹配，会将 `fastboot_mode`、`recovery_mode` 和 `factory_mode` 标志全部重置为 1，并将格式版本恢复为 `1.0`。
它不仅是用于显示版本的字符串，也是决定是否初始化另外三个启动模式设置的基准值。
随意修改此值可能导致相关启动模式设置自动发生变化，需要谨慎。


