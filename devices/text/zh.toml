[factory_mode]
name = "工厂模式（Factory）启动标志"
help.TB520FU = """
0 = 允许
1 = 阻止

此标志用于允许或限制与工厂（Factory）模式相关的部分启动处理。
值为 0 时，允许将工厂模式字符串作为 androidboot.mode= 启动参数传递，也允许执行启动菜单中准备 ffbm-00 的路径。
值为 1 时，会跳过这些处理路径。此设置不会统一阻止进入工厂及诊断模式的所有路径。
仅设置此值并不会进入工厂模式，还需要单独的启动模式请求才能生效。
此标志不会执行恢复出厂设置（FDR），也不会擦除用户数据。

"""

