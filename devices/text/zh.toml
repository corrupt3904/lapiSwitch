[fastboot_mode]
name = "Fastboot 快捷键进入限制"
help.TB520FU = """
0 = 允许
1 = 阻止

此标志用于允许或阻止设备在上电时通过特定按键组合（快捷键）进入 Fastboot 模式。
值为 0 时，允许通过快捷键进入 Fastboot 模式。
值为 1 时，阻止通过快捷键进入 Fastboot 模式。
此值既不表示设备当前是否处于 Fastboot 模式，也不是将下次启动指定为 Fastboot 模式的设置。
它不会影响通过重启命令等其他路径进入 Fastboot 模式。

