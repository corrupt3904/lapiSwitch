# DeviceInfo field names and help, 简体中文, for every device.
#
# [field key] as in devices/<MODEL>/deviceinfo.toml (repeated fields keep {n});
# ["@rollback"] and ["@persistent"] are the two group boxes.
# name = shown name; help = the help window text, line breaks as written.
# Where a device differs, give it its own text: help.<MODEL> = """..."""
# (name.<MODEL> likewise). A field only one device has is shown only there.
# In a repeated field {n} becomes the entry number; ["rollback_index[2]"] gives one entry its own text.
# A missing entry falls back to en.toml.

["@rollback"]
help = """
此区域保存 AVB（Android Verified Boot）用于防回滚的基准值，由 32 个 8 字节整数构成。
各条目的编号表示 AVB 的 `rollback_index_location`。
如果镜像的回滚索引低于已保存的基准值，就会出现回滚验证错误；是否实际阻止启动，可能取决于引导加载程序的 Locked/Unlocked 状态。
启动过程中，引导加载程序可能会将回滚索引更新为更高的值并保存。
"""

["@persistent"]
help = """
这是 AVB（Android Verified Boot）用于在不同启动之间保留状态信息的持久存储区域（Persistent Storage）。
最多可保存 8 条记录，每条记录由名称（Name）和值（Value）组成。
启动过程中，AVB 可根据需要读取或修改已保存的持久值。
此区域没有存储数据，并不意味着 AVB 功能已被禁用。

"""

[magic]
name = "DeviceInfo 标识值（magic）"
help = """
DeviceInfo 的格式标识符，为 13 字节的 ANDROID-BOOT!。
启动时，如果此值不匹配，引导加载程序会将整个 DeviceInfo 填充为 0，并使用默认值重新创建。
此时，公钥、回滚索引、AVB 持久值、区域等数据也会一并丢失。

"""

[is_unlocked]
name = "引导加载程序 Unlock 标志"
help = """
0 = 引导加载程序 Locked
1 = 引导加载程序 Unlocked

此标志表示引导加载程序的 Locked/Unlocked 状态。
在 Locked 状态下，如果 AVB（Android Verified Boot）验证失败，启动会被阻止；在 Unlocked 状态下，则允许验证失败。
在 Unlocked 状态下，verifiedbootstate 会变为 Orange，这可能降低 Play Integrity 和 Widevine DRM 等安全机制的信任级别。
更改此标志后，引导加载程序会要求重置用户数据；如果不执行重置，将无法正常启动。

"""

[is_unlock_critical]
name = "Critical Unlock 标志"
help = """
0 = Critical Locked
1 = Critical Unlocked

此标志表示关键分区的 Locked/Unlocked 状态。
在 Critical Locked 状态下，通过 Fastboot 刷写或擦除关键分区的操作会被阻止。
即使引导加载程序处于 Unlocked 状态，只要仍为 Critical Locked，关键分区的操作限制就会保留。
更改此标志后，引导加载程序会要求重置用户数据；如果不执行重置，将无法正常启动。

"""

[charger_screen_enabled]
name = "充电画面显示"
help.TB520FU = """
0 = 启用
1 = 禁用

此设置决定设备在关机状态下连接充电器时，是否进入仅充电模式。
启用后，连接充电器时会根据条件进入显示电池电量等信息的仅充电模式，而不是正常启动 Android。
禁用后，会跳过进入仅充电模式的过程。
此设置不控制充电功能本身，也不影响充电速度或 Android 运行时的充电状态显示。

"""
help.TB522FU = """
0 = 禁用
1 = 启用

此设置决定设备在关机状态下连接充电器时，是否进入仅充电模式。
启用后，连接充电器时会根据条件进入显示电池电量等信息的仅充电模式，而不是正常启动 Android。
禁用后，会跳过进入仅充电模式的过程。
此设置不控制充电功能本身，也不影响充电速度或 Android 运行时的充电状态显示。

"""

[bootloader_version]
name = "引导加载程序版本字符串"
help = """
Fastboot 中以 version-bootloader 显示的引导加载程序版本字符串。
更改此值不会影响实际的引导加载程序代码或安全补丁级别。
字符串以空字符结尾格式（Null-terminated string）保存，因此必须保留末尾的空字符（\\0）。

"""

[radio_version]
name = "无线电/基带版本字符串"
help = """
Fastboot 中以 version-baseband 显示的 Radio/Baseband 版本字符串。
更改此值不会影响实际的引导加载程序代码或安全补丁级别。
字符串以空字符结尾格式（Null-terminated string）保存，因此必须保留末尾的空字符（\\0）。

"""

[verity_mode]
name = "verity 模式"
help = """
0 = logging
1 = enforcing

此值表示引导加载程序的 Verity 状态。
在 AVB 2.0 处理路径中，如果此值为 0，会设置一个标志，表示设备因 Hashtree 损坏而重启。
发生 Verity 错误时的最终处理方式（重启或 EIO），由 AVB 的持久设置值（avb.managed_verity_mode）和镜像设置决定。

"""

[reserved_0091]
name = "保留区域（推测为对齐填充）"
help = """
此区域位于 verity_mode 字段之后，共 3 字节，推测是为后续 4 字节整数字段进行内存对齐（Alignment）而保留的填充（Padding）空间。
尚未确认此区域的独立功能或用途。
不能断定此区域未被使用，因此不建议随意修改其值。

"""

[user_public_key_length]
name = "用户公钥长度"
help = """
表示用户注册的 AVB 公钥中有效数据的长度，单位为字节。（最大 2048 字节）
值为 0 表示未注册用户公钥，不会影响厂商内置公钥。
此值表示公钥数据的长度，不代表 RSA 密钥的位数或加密算法标识符。
如果指定的长度与实际公钥数据不一致，可能导致公钥验证和信任判定出现问题。

"""

[user_public_key]
name = "自定义 AVB 公钥"
help.TB520FU = """
用户自定义的 AVB（Android Verified Boot）公钥数据。
引导加载程序会将镜像公钥与已注册的用户公钥进行长度和内容比较，以判断是否信任该公钥。
如果与用户公钥不匹配，会基于厂商内置公钥进行进一步验证。
在 Locked 状态下，如果通过自定义 AVB 公钥进行 AVB 验证，verifiedbootstate 会变为 Yellow，这可能降低 Play Integrity 和 Widevine DRM 等安全机制的信任级别。

"""
help.TB522FU = """
用户自定义的 AVB（Android Verified Boot）公钥数据。
引导加载程序会将镜像公钥与已注册的用户公钥进行长度和内容比较，以判断是否信任该公钥。
如果与用户公钥不匹配，会基于厂商内置公钥进行进一步验证。
在 Locked 状态下，如果通过自定义 AVB 公钥进行 AVB 验证，verifiedbootstate 会变为 Yellow，这可能降低 Play Integrity 和 Widevine DRM 等安全机制的信任级别。
（TB522FU 型号未提供注册用户 AVB 公钥的官方方法。）

"""

["rollback_index[{n}]"]
name = "回滚索引（未使用）"
help = """
Rollback Index Location: {n} - 未使用

回滚索引只能以十进制输入，最多允许 10 位数字。
输入值会转换为 8 字节整数，并以小端序（Little-endian）格式保存。
"""

["rollback_index[0]"]
name = "回滚索引（vbmeta）"
help = """
Rollback Index Location: 0 - vbmeta

回滚索引只能以十进制输入，最多允许 10 位数字。
输入值会转换为 8 字节整数，并以小端序（Little-endian）格式保存。
"""

["rollback_index[1]"]
name = "回滚索引（recovery）"
help = """
Rollback Index Location: 1 - recovery

回滚索引只能以十进制输入，最多允许 10 位数字。
输入值会转换为 8 字节整数，并以小端序（Little-endian）格式保存。
"""

["rollback_index[2]"]
name = "回滚索引（vbmeta_system）"
help = """
Rollback Index Location: 2 - vbmeta_system

回滚索引只能以十进制输入，最多允许 10 位数字。
输入值会转换为 8 字节整数，并以小端序（Little-endian）格式保存。
"""

["rollback_index[3]"]
name = "回滚索引（boot）"
help = """
Rollback Index Location: 3 - boot

回滚索引只能以十进制输入，最多允许 10 位数字。
输入值会转换为 8 字节整数，并以小端序（Little-endian）格式保存。
"""

["persistent[{n}].valid"]
name = "AVB 持久值使用状态"
help = """
0 = 未使用
1 = 使用

此标志表示该 AVB 持久值（Persistent Value）记录是否正在使用。
值为 1 时，将其视为有效记录并使用。
值为 0 或大于等于 2 时，将其视为未使用的记录。

"""

["persistent[{n}].name_length"]
name = "AVB 持久值名称长度"
help = """
表示比较 AVB 持久值（Persistent Value）名称时所用有效数据的长度，单位为字节。（最大 56 字节）
此值指定名称比较时使用的字节数。
如果指定的长度与实际名称数据不一致，可能无法正确识别持久值。

"""

["persistent[{n}].value_length"]
name = "AVB 持久值数据长度"
help = """
表示 AVB 持久值（Persistent Value）中所存数据的有效长度，单位为字节。（最大 32 字节）
此值指定作为实际数据使用的字节数。
如果指定的长度与实际数据不一致，可能无法正确读取或处理持久值。

"""

["persistent[{n}].name"]
name = "AVB 持久值名称"
help = """
用于标识 AVB 持久值（Persistent Value）条目的名称数据。
名称的有效长度由 `name_length` 字段指定的字节数决定。
由于数据范围由单独的长度字段划定，字符串末尾可能不包含空终止字符（`\\0`）。

"""

["persistent[{n}].value"]
name = "AVB 持久值数据"
help = """
以 AVB 持久值（Persistent Value）的名称为对应项保存的原始数据。
数据的有效长度由 `value_length` 字段指定的字节数决定。
所存数据的格式和含义取决于该持久值的名称及用途。
不能将所有数据统一解释为字符串或整数；在不考虑数据格式的情况下修改值，可能影响 AVB 的运行。

"""

[golden_snapshot]
name = "golden snapshot（推测）"
help = """
一个 8 字节整数值，通过与特定常量（`0x575757`）比较来判断状态。
此值不是简单的启用/禁用标志，即使输入 `1`，也不会被视为启用状态。
`golden_snapshot` 这一名称来自外部结构体，尚未确认官方字段名称或确切用途。
在已分析的引导加载程序中，相关的 `Erase swap on restore` 显示路径已禁用；尚未确认其与实际快照恢复或 Swap 数据擦除功能的关联。
由于无法确认确切行为及修改后的影响，不建议随意更改此值。

"""

[audio_framework]
name = "音频框架缓冲区"
help = """
此区域保存音频框架名称，启动时通过 `androidboot.audio` 参数传递给 Android。
允许的值为 `audioreach`、`elite` 和 `awe`，区分大小写。
如果输入不允许的值，启动过程中会将其重置为空字符串并保存。
此值用于标识音频框架，并非调整音频固件版本或音质的设置。

"""

[fdr_frs_uds_flag]
name = "FDR/FRS-UDS 状态"
help = """
检测到特定的 Recovery 恢复出厂设置请求时，此标志用于请求更新与 FRS 相关的安全秘密值。
检测到特定重置请求（`--reason=MainClearConfirm`）时，此值会被设为 1，并清空相关缓存。
后续 FRS/UDS 处理成功后，引导加载程序仅在标志恰好为 1 时将其恢复为 0，并保存响应中收到的缓存。
引导加载程序仅在值恰好为 1 时清除此标志，因此如果一直保留大于等于 2 的值，安全秘密值的重新生成过程可能反复执行。
此标志不会直接擦除用户数据（Userdata），但与安全密钥派生过程有关，因此不建议随意更改。

"""

[reserved_0CA1]
name = "保留区域（推测为对齐填充）"
help = """
此区域位于 FDR 标志与缓存长度字段之间，共 3 字节，推测是用于内存对齐（Alignment）的填充（Padding）空间。
尚未确认此区域的独立功能或确切用途。
不能断定此区域未被使用，因此不建议随意修改其值。

"""

[frs_uds_cache_length]
name = "FRS/UDS 缓存长度"
help = """
表示 FRS/UDS 安全秘密值缓存中有效数据的长度，单位为字节。
正常缓存数据的长度为 32 字节，KeyMint 会拒绝超过 32 字节的值。
值为 0 表示没有保存缓存数据。
是否生成新的安全秘密值，不仅由缓存长度决定，还取决于存储状态和 FDR 标志。
随意修改此值可能影响安全秘密值的正常处理，需要谨慎。

"""

[frs_uds_cache]
name = "FRS/UDS 缓存（设备特有）"
help = """
此区域保存用于派生 FRS 的 32 字节安全秘密值（SECRET）的副本。
此值是用于派生 FRS 的原始秘密值，并非 FRS 的派生结果本身。
由此值派生的 FRS 用于保护 KeyMint 的部分加密密钥。
复制其他设备的值或恢复为以前的值，可能导致现有加密密钥无法正常使用。
此值可能在恢复出厂设置等过程中发生变化，因此不是永久固定的设备标识符（Device ID）。
此值直接关系到安全密钥派生和加密数据保护，因此不建议随意更改。

"""

[region_magic_1]
name = "区域记录标识值 1（magic）"
help.TB520FU = """
此标记（Magic Value）用于标识区域（Region）记录的起始位置，保存的内容为 ASCII 字符串 `deadbeef`。
两个区域标识值均匹配时，引导加载程序才会将已保存的区域信息视为有效数据并用于验证。
只要有任意一个标识值不匹配，引导加载程序就不会使用现有区域信息，而会进入生成新区域记录的路径。
此值是用于标识记录的固定标记，并非用于验证数据完整性的签名或校验和。
随意修改此值可能使现有区域信息被视为无效，需要谨慎。

"""

help.TB522FU = """
此标记（Magic Value）用于标识区域（Region）记录的起始位置，保存的内容为 ASCII 字符串 `deadbeef`。
两个区域标识值均匹配时，引导加载程序才会将已保存的区域信息视为有效数据并用于验证。
如果仅一个标识值匹配，则会将信息视为损坏并拒绝启动；如果两个都不匹配，则仅在调用时启动状态为 green 的情况下重新生成区域信息。
此值是用于标识记录的固定标记，并非用于验证数据完整性的签名或校验和。
随意修改此值可能使现有区域信息被视为无效，需要谨慎。

"""

[region_info_version]
name = "区域记录版本"
help = """
此值表示区域（Region）记录的数据结构版本。
正常版本值为 1，引导加载程序以此判断记录是否有效。
值大于等于 2 时，会被视为不支持的版本，并按版本不匹配错误处理。
随意修改此值可能导致区域信息无法被正确识别，需要谨慎。

"""

[oem_reserved_1]
name = "OEM 保留区域（用途未确认）"
help = """
逻辑 DeviceInfo 结构体中的保留区域，尚未确认其确切用途。
尚未确认此区域中各个字节的功能或作用。
在读取或保存整个 DeviceInfo 结构体或单条区域（Region）记录时，会一并处理此区域。
即使尚未发现独立功能，也不能断定此区域未被使用，因此不建议随意修改其值或将其重置为 0。

"""

[region]
name = "区域"
help.TB520FU = """
表示设备区域（Region）的 3 字节字符串，保存的值为 `PRC` 或 `ROW`。
启动过程中，引导加载程序会将此值与固件 DTB 中的区域信息（`region_country`）比较，以检查兼容性。
如果两个值不一致，会显示“不兼容的系统”提示并停止启动。
此值与设备的国家代码分开管理，用于判断与固件的区域兼容性。
随意修改此值可能导致与固件的区域不匹配，进而无法正常启动。

"""
help.TB522FU = """
