# DeviceInfo field names and help, 日本語, for every device.
#
# [field key] as in devices/<MODEL>/deviceinfo.toml (repeated fields keep {n});
# ["@rollback"] and ["@persistent"] are the two group boxes.
# name = shown name; help = the help window text, line breaks as written.
# Where a device differs, give it its own text: help.<MODEL> = """..."""
# (name.<MODEL> likewise). A field only one device has is shown only there.
# In a repeated field {n} becomes the entry number; ["rollback_index[2]"] gives one entry its own text.
# A missing entry falls back to en.toml.

["@rollback"]
help = """
AVB のロールバック防止基準値 32 個です。
各項目は 64 ビット整数です。
番号は A/B スロットではなく、AVB の rollback_index_location です。
イメージのロールバックインデックスがこの値より低いとロールバックエラーになり、実際に起動を止めるかはロック状態もあわせて決まります。
起動中にブートローダーが値を上げて保存することがあります。
日付のように見えても発売日ではなく、セキュリティ上の基準値です。
（確定）

"""

["@persistent"]
help = """
AVB が起動の間で状態を記憶するための保存領域です。
名前/値のレコード 8 個からなり、たとえば avb.managed_verity_mode がここに保存されます。
起動中に AVB が内容を変えることがあります。
空でも AVB がオフという意味ではありません。
persist.img パーティションとは別の領域です。
（確定）

"""

[magic]
name = "DeviceInfo の識別値（マジック値）"
help = """
DeviceInfo の形式識別子で、13 バイトの ANDROID-BOOT! です。
起動時にこの値が異なると、ブートローダーは DeviceInfo 全体を 0 で消去して既定値で作り直します。
このとき公開鍵、ロールバックインデックス、AVB 永続値、リージョンも失われます。
署名やチェックサムではないため、値が合っていても残りの内容が正常とは限りません。
（確定）

"""

[is_unlocked]
name = "ブートローダーのアンロック状態"
help = """
0 = ブートローダーのロック
1 = ブートローダーのアンロック

一般的なブートローダーのロック状態です。
AVB 検証で検証エラーを許容するかの判断に使われ、Fastboot のロック表示や書き込み・消去の制限にも関わる、実際のセキュリティ判断値です。
正式なロック変更手順はセキュリティ状態の更新とデータ初期化の要求まで行うため、このバイトだけを変えることとは異なります。
（確定）

"""

[is_unlock_critical]
name = "critical アンロック状態"
help = """
0 = 追加ロック維持
1 = 解除

重要パーティションに対する追加のロック状態です。
0 の場合、重要パーティションに分類された対象の書き込み・消去は拒否されます。
is_unlocked = 1 でも、この値が 0 なら重要パーティションの制限は残ります。
（確定）

"""

[charger_screen_enabled]
name = "充電画面の表示設定"
help.TB520FU = """
0 = 使用
1 = 使用しない

電源オフの状態で充電器を接続したときの充電起動ポリシー（off-mode-charge）の保存値です。
実際に充電画面に入るかは、充電器の検出や他の起動要求もあわせて判断されます。
現在充電中かどうかを示す値ではありません。
（確定）

"""
help.TB522FU = """
0 = 使用しない
1 = 使用

電源オフの状態で充電器を接続したときの充電起動ポリシー（off-mode-charge）の保存値です。
実際に充電画面に入るかは、充電器の検出や他の起動要求もあわせて判断されます。
現在充電中かどうかを示す値ではありません。
（確定）

"""

[bootloader_version]
name = "ブートローダーのバージョン文字列"
help = """
Fastboot の version-bootloader で表示されるブートローダーのバージョン文字列です。
変更しても実際のブートローダーのコードやセキュリティパッチの状態は変わりません。
文字列として使われるため、末尾に終端文字（0）がある形を保つ必要があります。
（確定）

"""

[radio_version]
name = "無線/ベースバンドのバージョン文字列"
help = """
Fastboot の version-baseband で表示される Radio/ベースバンドのバージョン文字列です。
変更しても実際の通信ファームウェアは変わりません。
（確定）

"""

[verity_mode]
name = "verity モード"
help = """
0 = logging
1 = enforcing

ブートローダーの Verity 状態値です。
AVB2 の経路では、値が 0 のとき「hashtree 破損により再起動」フラグを追加します。
最終的なエラー処理（再起動/EIO）は AVB 永続値（avb.managed_verity_mode）とイメージの設定がともに決めます。
2 以上は正常なモードではなく、ブートローダーが隣の表（起動カラー文字列）を誤って読むことになります。
（確定）

"""

[reserved_0091]
name = "アライメント用／予約領域"
help = """
verity_mode の後ろの 3 バイトで、次の 4 バイト整数を整列させるための領域と見られます。
独立した機能は確認されていません。
「使われていないので自由に変えてよい」という根拠はありません。
（未確認）

"""

[user_public_key_length]
name = "ユーザー公開鍵の長さ"
help = """
下のユーザー AVB 公開鍵の有効バイト数です（最大 2048）。
0 はユーザー登録の公開鍵がない状態で、メーカー内蔵の鍵はそのままです。
RSA のビット数やアルゴリズム番号ではありません。
長さと内容が合わないと、公開鍵の信頼判断に問題が生じることがあります。
（確定）

"""

[user_public_key]
name = "ユーザー公開鍵"
help.TB520FU = """
ユーザーが登録した AVB 公開鍵です。
ブートローダーはイメージの公開鍵と長さ・内容が同じかを比較して信頼するかを決めます。
一致しない場合はメーカー内蔵の鍵と比較します。
変更すると AVB の信頼判断に影響します。
秘密鍵ではないため、この値だけで署名を作ることはできません。
（確定）

"""
help.TB522FU = """
ユーザーが登録した AVB 公開鍵です。
ブートローダーはイメージの公開鍵と長さ・内容が同じかを比較して信頼するかを決めます。
一致しない場合はメーカー内蔵の鍵と比較します。
変更すると AVB の信頼判断に影響します。
秘密鍵ではないため、この値だけで署名を作ることはできません。
（確定。TB522FU は登録コマンドの経路が未確認）

"""

["rollback_index[{n}]"]
name = "ロールバックインデックス"
help = """
Rollback Index Location: {n} - 未使用

ロールバックインデックスは 10 進数でのみ入力でき、最大 10 桁まで入力できます。
入力した値は 8 バイト整数に変換され、リトルエンディアン（Little-endian）形式で保存されます。
"""

["rollback_index[0]"]
help = """
Rollback Index Location: 0 - vbmeta

ロールバックインデックスは 10 進数でのみ入力でき、最大 10 桁まで入力できます。
入力した値は 8 バイト整数に変換され、リトルエンディアン（Little-endian）形式で保存されます。
"""

