[factory_mode]
name = "工場モード（Factory）起動フラグ"
help.TB520FU = """
0 = 許可
1 = ブロック

工場（Factory）モードに関連する一部の起動処理を許可または制限するフラグです。
値が0の場合、工場モードの文字列をandroidboot.mode=起動引数として渡す処理と、起動メニューでffbm-00を準備する経路が許可されます。
値が1の場合、これらの処理経路をスキップします。工場・診断モードへのすべての移行経路を一括してブロックする設定ではありません。
この値だけで工場モードに入るわけではなく、動作には別途ブートモードの要求が必要です。
工場出荷時リセット（FDR）を実行したり、ユーザーデータを消去したりするフラグではありません。

"""

help.TB522FU = """
0 = ブロック
1 = 許可

工場（Factory）モードに関連する設定値です。
Fastbootでのfactory-modeの照会と変更に使用され、保存された0または1をそのまま返します。
DeviceInfoを新しく初期化する経路や、形式バージョンを修復する経路では、この値を1に設定します。
ただし、FFBMメニュー処理とandroidboot.mode=起動引数の構成経路では、この値で処理を許可またはブロックする検査は確認されていません。
したがって、0または1を設定することで、実際に工場モードでの起動が許可またはブロックされるとは断定できません。
工場出荷時リセット（FDR）を実行したり、ユーザーデータを消去したりするフラグではありません。

"""

[deviceinfo_format_version]
name = "DeviceInfo形式バージョン"
help = """
DeviceInfoデータ構造の形式バージョンを表す文字列で、正常値は `1.0` です。
起動中に、ブートローダーはこの値を確認し、DeviceInfo形式の有効性を判断します。
値が `1.0` と一致しない場合、`fastboot_mode`、`recovery_mode`、`factory_mode` の各フラグをすべて1に再設定し、形式バージョンを `1.0` に戻します。
単なるバージョン表示用の文字列ではなく、ほかの3つのブートモード設定を初期化するかどうかを決める基準値です。
この値を任意に変更すると、関連するブートモード設定が自動的に変更される可能性があるため、注意が必要です。


"""

