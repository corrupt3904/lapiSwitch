（未確認）

"""

[frs_uds_cache_length]
name = "FRS/UDS キャッシュの長さ"
help = """
下のセキュリティ秘密値キャッシュの有効な長さです。
正常値は 32 で、Keymint は 32 を超える長さを拒否します。
0 はキャッシュがないことを意味し、新しい秘密値を作るかは保存領域の状態と FDR フラグがともに決めます。
（確定）

"""

[frs_uds_cache]
name = "FRS/UDS キャッシュ（デバイス固有）"
help = """
FRS の導出に使われる 32 バイトのセキュリティ秘密値（SECRET）のコピーです。
FRS の結果値そのものではありません。
Keymint の一部の鍵の暗号化に、この値から得た FRS が使われます。
そのため、他のデバイスの値をコピーしたり、以前の値に戻したりしてはいけません。
工場出荷時リセットなどで変わることがあるため、固定のデバイス ID でもありません。
（確定。内部の意味は TB520FU の Keymint 基準）

"""

