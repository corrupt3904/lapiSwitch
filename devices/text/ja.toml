# DeviceInfo field names and help, 日本語, for every device.
#
# [field key] as in devices/<MODEL>/deviceinfo.toml (repeated fields keep {n});
# ["@rollback"] and ["@persistent"] are the two group boxes.
# name = shown name; help = the help window text, line breaks as written.
# Where a device differs, give it its own text: help.<MODEL> = """..."""
# (name.<MODEL> likewise). A field only one device has is shown only there.
# In a repeated field {n} becomes the entry number; ["rollback_index[2]"] gives one entry its own text.
# A missing entry falls back to en.toml.

["@rollback"]
help = """
AVB（Android Verified Boot）のロールバック防止に使用する基準値を保存する領域で、合計32個の8バイト整数で構成されます。
各項目の番号は、AVBの `rollback_index_location` を表します。
イメージのロールバックインデックスが保存された基準値より低い場合、ロールバック検証エラーが発生します。実際に起動がブロックされるかどうかは、ブートローダーのLocked/Unlocked状態によって異なる場合があります。
起動中に、ブートローダーがロールバックインデックスをより高い値に更新して保存することがあります。
"""

["@persistent"]
help = """
AVB（Android Verified Boot）が起動をまたいで状態情報を保持するために使用する永続ストレージ（Persistent Storage）領域です。
名前（Name）と値（Value）の組からなるレコードを、合計8件保存できます。
起動中に、AVBが必要に応じて保存済みの永続値を読み取ったり変更したりすることがあります。
この領域にデータが保存されていなくても、AVBが無効になっていることを意味するわけではありません。

"""

[magic]
name = "DeviceInfo識別値（magic）"
help = """
DeviceInfoの形式識別子で、13バイトのANDROID-BOOT!です。
起動時にこの値が一致しない場合、ブートローダーはDeviceInfo全体を0で消去し、初期値で作り直します。
このとき、公開鍵、ロールバックインデックス、AVB永続値、リージョンなども失われます。

"""

[is_unlocked]
name = "ブートローダーUnlockフラグ"
help = """
0 = ブートローダーLocked
1 = ブートローダーUnlocked

ブートローダーのLocked/Unlocked状態を表すフラグです。
Locked状態では、AVB（Android Verified Boot）の検証に失敗すると起動がブロックされますが、Unlocked状態では検証の失敗が許容されます。
Unlocked状態ではverifiedbootstateがOrangeに変わり、それに伴ってPlay IntegrityやWidevine DRMなどのセキュリティ上の信頼レベルが低下する可能性があります。
このフラグを変更すると、ブートローダーがユーザーデータの初期化を要求します。初期化を行わない場合、正常に起動できません。

"""

[is_unlock_critical]
name = "Critical Unlockフラグ"
help = """
0 = Critical Locked
1 = Critical Unlocked

重要パーティションのLocked/Unlocked状態を表すフラグです。
Critical Locked状態では、Fastbootによる重要パーティションへの書き込みと消去がブロックされます。
ブートローダーがUnlocked状態であっても、Critical Locked状態であれば重要パーティションへの操作制限は維持されます。
このフラグを変更すると、ブートローダーがユーザーデータの初期化を要求します。初期化を行わない場合、正常に起動できません。

"""

[charger_screen_enabled]
name = "充電画面の表示"
help.TB520FU = """
0 = 有効
1 = 無効

電源が切れている状態で充電器を接続したときに、充電専用モードに入るかどうかを設定する値です。
有効な場合、充電器の接続時に条件に応じて通常のAndroid起動ではなく、バッテリー残量などを表示する充電専用モードに入ります。
無効な場合、充電専用モードに入る処理をスキップします。
この設定は充電機能そのものを制御するものではなく、充電速度やAndroid動作中の充電状態表示には影響しません。

"""
help.TB522FU = """
0 = 無効
1 = 有効

電源が切れている状態で充電器を接続したときに、充電専用モードに入るかどうかを設定する値です。
有効な場合、充電器の接続時に条件に応じて通常のAndroid起動ではなく、バッテリー残量などを表示する充電専用モードに入ります。
無効な場合、充電専用モードに入る処理をスキップします。
この設定は充電機能そのものを制御するものではなく、充電速度やAndroid動作中の充電状態表示には影響しません。

"""

[bootloader_version]
name = "ブートローダーバージョン文字列"
help = """
Fastbootのversion-bootloaderとして表示される、ブートローダーのバージョン文字列です。
この値を変更しても、実際のブートローダーのコードやセキュリティパッチレベルには影響しません。
文字列はNull終端形式（Null-terminated string）で保存されるため、末尾にNull文字（\\0）が含まれる形式を維持する必要があります。

"""

[radio_version]
name = "ラジオ/ベースバンドバージョン文字列"
help = """
Fastbootのversion-basebandとして表示される、Radio/Basebandのバージョン文字列です。
この値を変更しても、実際のブートローダーのコードやセキュリティパッチレベルには影響しません。
文字列はNull終端形式（Null-terminated string）で保存されるため、末尾にNull文字（\\0）が含まれる形式を維持する必要があります。

"""

[verity_mode]
name = "verityモード"
help = """
0 = logging
1 = enforcing

ブートローダーのVerity状態を表す値です。
AVB 2.0の処理経路では、この値が0の場合、Hashtreeの破損によって再起動したことを示すフラグが設定されます。
Verityエラー発生時の最終的な処理方法（再起動またはEIO）は、AVBの永続設定値（avb.managed_verity_mode）とイメージの設定によって決まります。

"""

[reserved_0091]
name = "予約領域（アラインメント用パディングと推定）"
help = """
verity_modeフィールドの後ろにある3バイトの領域で、次の4バイト整数フィールドのメモリアラインメント（Alignment）のためのパディング（Padding）と推定されます。
この領域の独立した機能や用途は確認されていません。
未使用領域とは断定できないため、値を任意に変更することは推奨しません。

"""

[user_public_key_length]
name = "ユーザー公開鍵の長さ"
help = """
ユーザーが登録したAVB公開鍵の有効なデータ長を、バイト単位で表す値です。（最大2048バイト）
値が0の場合、ユーザー公開鍵が登録されていないことを意味し、メーカー内蔵の公開鍵には影響しません。
この値は公開鍵データの長さを表し、RSA鍵のビット数や暗号化アルゴリズムの識別子を意味するものではありません。
指定された長さが実際の公開鍵データと一致しない場合、公開鍵の検証や信頼性の判定に問題が生じる可能性があります。

"""

[user_public_key]
name = "カスタムAVB公開鍵"
help.TB520FU = """
ユーザー指定のAVB（Android Verified Boot）公開鍵データです。
ブートローダーは、イメージの公開鍵と登録済みのユーザー公開鍵の長さと内容を比較し、信頼できるかどうかを判断します。
ユーザー公開鍵と一致しない場合は、メーカー内蔵の公開鍵を基準に追加の検証を行います。
Locked状態でユーザー指定のAVB公開鍵によるAVB検証が行われる場合、verifiedbootstateがYellowに変わり、それに伴ってPlay IntegrityやWidevine DRMなどのセキュリティ上の信頼レベルが低下する可能性があります。

"""
help.TB522FU = """
ユーザー指定のAVB（Android Verified Boot）公開鍵データです。
ブートローダーは、イメージの公開鍵と登録済みのユーザー公開鍵の長さと内容を比較し、信頼できるかどうかを判断します。
ユーザー公開鍵と一致しない場合は、メーカー内蔵の公開鍵を基準に追加の検証を行います。
Locked状態でユーザー指定のAVB公開鍵によるAVB検証が行われる場合、verifiedbootstateがYellowに変わり、それに伴ってPlay IntegrityやWidevine DRMなどのセキュリティ上の信頼レベルが低下する可能性があります。
（TB522FUモデルには、ユーザーAVB公開鍵を登録するための公式な方法が用意されていません。）

"""

["rollback_index[{n}]"]
name = "ロールバックインデックス（未使用）"
help = """
Rollback Index Location: {n} - 未使用

ロールバックインデックスは10進数でのみ入力でき、最大10桁まで指定できます。
入力値は8バイト整数に変換され、リトルエンディアン（Little-endian）形式で保存されます。
"""

["rollback_index[0]"]
name = "ロールバックインデックス（vbmeta）"
help = """
Rollback Index Location: 0 - vbmeta

ロールバックインデックスは10進数でのみ入力でき、最大10桁まで指定できます。
入力値は8バイト整数に変換され、リトルエンディアン（Little-endian）形式で保存されます。
"""

["rollback_index[1]"]
name = "ロールバックインデックス（recovery）"
help = """
Rollback Index Location: 1 - recovery

ロールバックインデックスは10進数でのみ入力でき、最大10桁まで指定できます。
入力値は8バイト整数に変換され、リトルエンディアン（Little-endian）形式で保存されます。
"""

["rollback_index[2]"]
name = "ロールバックインデックス（vbmeta_system）"
help = """
Rollback Index Location: 2 - vbmeta_system

ロールバックインデックスは10進数でのみ入力でき、最大10桁まで指定できます。
入力値は8バイト整数に変換され、リトルエンディアン（Little-endian）形式で保存されます。
"""

["rollback_index[3]"]
name = "ロールバックインデックス（boot）"
help = """
Rollback Index Location: 3 - boot

ロールバックインデックスは10進数でのみ入力でき、最大10桁まで指定できます。
入力値は8バイト整数に変換され、リトルエンディアン（Little-endian）形式で保存されます。
"""

["persistent[{n}].valid"]
name = "AVB永続値の使用状態"
help = """
0 = 未使用
1 = 使用

このAVB永続値（Persistent Value）レコードが使用されているかどうかを表すフラグです。
値が1の場合、有効なレコードと判断して使用します。
値が0または2以上の場合、未使用レコードとして扱います。

"""

["persistent[{n}].name_length"]
name = "AVB永続値の名前の長さ"
help = """
AVB永続値（Persistent Value）の名前を比較するときに使用する、有効なデータ長をバイト単位で表す値です。（最大56バイト）
名前の比較に使用するバイト数を指定します。
指定された長さが実際の名前データと一致しない場合、永続値を正しく識別できない可能性があります。

"""

["persistent[{n}].value_length"]
name = "AVB永続値のデータ長"
help = """
AVB永続値（Persistent Value）に保存されたデータの有効長を、バイト単位で表す値です。（最大32バイト）
実際のデータとして使用するバイト数を指定します。
指定された長さが実際のデータと一致しない場合、永続値を正しく読み取ったり処理したりできない可能性があります。

"""

["persistent[{n}].name"]
name = "AVB永続値の名前"
help = """
AVB永続値（Persistent Value）の項目を識別するための名前データです。
名前の有効長は、`name_length` フィールドで指定されたバイト数に基づいて決まります。
別の長さフィールドでデータ範囲を区切るため、文字列の末尾にNull終端文字（`\\0`）が含まれない場合があります。

"""

["persistent[{n}].value"]
name = "AVB永続値のデータ"
help = """
AVB永続値（Persistent Value）の名前に対応して保存される生データです。
データの有効長は、`value_length` フィールドで指定されたバイト数に基づいて決まります。
保存されたデータの形式と意味は、その永続値の名前と用途によって異なります。
すべてのデータを一律に文字列や整数として解釈することはできません。データ形式を考慮せずに値を変更すると、AVBの動作に影響する可能性があります。

"""

[golden_snapshot]
name = "golden snapshot（推定）"
help = """
特定の定数（`0x575757`）と比較して状態を判断する、8バイトの整数値です。
単純な有効/無効フラグではなく、`1` を入力しても有効状態としては扱われません。
`golden_snapshot` という名称は外部の構造体に基づくもので、公式なフィールド名や正確な用途は確認されていません。
解析したブートローダーでは、関連する表示経路である `Erase swap on restore` が無効になっており、実際のスナップショット復元やSwapデータ消去機能との関連は確認されていません。
正確な動作や変更による影響が確認できないため、値を任意に変更することは推奨しません。

"""

[audio_framework]
name = "オーディオフレームワークバッファ"
help = """
起動時に `androidboot.audio` パラメーターを通じてAndroidへ渡す、オーディオフレームワーク名を保存する領域です。
指定可能な値は `audioreach`、`elite`、`awe` で、大文字と小文字を区別します。
指定可能な値以外を入力すると、起動中に空文字列に初期化して保存されます。
オーディオフレームワークの識別に使用する値であり、オーディオファームウェアのバージョンや音質を調整する設定ではありません。

"""

[fdr_frs_uds_flag]
name = "FDR/FRS-UDS状態"
help = """
特定のRecovery工場出荷時リセット要求を検出したときに、FRS関連のセキュリティシークレットの更新を要求するフラグです。
特定のリセット要求（`--reason=MainClearConfirm`）を検出すると、この値が1に設定され、関連するキャッシュが初期化されます。
その後のFRS/UDS処理が成功すると、ブートローダーはフラグが厳密に1の場合に限って0に戻し、応答で受け取ったキャッシュを保存します。
ブートローダーは値が厳密に1の場合にのみフラグをクリアするため、2以上の値が残ると、セキュリティシークレットの再生成が繰り返される可能性があります。
このフラグはユーザーデータ（Userdata）を直接消去しませんが、セキュリティ鍵の導出に関係するため、任意に変更することは推奨しません。

"""

[reserved_0CA1]
name = "予約領域（アラインメント用パディングと推定）"
help = """
FDRフラグとキャッシュ長フィールドの間にある3バイトの領域で、メモリアラインメント（Alignment）のためのパディング（Padding）と推定されます。
この領域の独立した機能や正確な用途は確認されていません。
未使用領域とは断定できないため、値を任意に変更することは推奨しません。

"""

[frs_uds_cache_length]
name = "FRS/UDSキャッシュ長"
help = """
FRS/UDSセキュリティシークレットのキャッシュに保存されたデータの有効長を、バイト単位で表す値です。
正常なキャッシュデータの長さは32バイトで、KeyMintは32バイトを超える値を拒否します。
値が0の場合、キャッシュデータが保存されていないことを意味します。
新しいセキュリティシークレットを生成するかどうかは、キャッシュ長だけでなく、ストレージの状態とFDRフラグによって決まります。
この値を任意に変更すると、セキュリティシークレットの正常な処理に影響する可能性があるため、注意が必要です。

"""

[frs_uds_cache]
name = "FRS/UDSキャッシュ（デバイス固有）"
help = """
FRSの導出に使用する32バイトのセキュリティシークレット（SECRET）のコピーを保存する領域です。
FRSの導出元となるシークレットであり、導出されたFRS値そのものではありません。
この値から導出されたFRSは、KeyMintの一部の暗号鍵を保護するために使用されます。
別のデバイスの値をコピーしたり以前の値に戻したりすると、既存の暗号鍵を正しく使用できなくなる可能性があります。
工場出荷時リセットなどの過程で値が変わることがあるため、永続的に固定されたデバイス識別子（Device ID）ではありません。
セキュリティ鍵の導出と暗号化データの保護に直接関係する値であるため、任意に変更することは推奨しません。

"""

[region_magic_1]
name = "リージョンレコード識別値1（magic）"
help.TB520FU = """
リージョン（Region）レコードの開始位置を識別するためのマーカー（Magic Value）で、ASCII文字列 `deadbeef` が保存されます。
2つのリージョン識別値が両方とも一致した場合に限り、ブートローダーは保存されたリージョン情報を有効なデータと判断し、検証に使用します。
どちらか一方でも識別値が一致しない場合、ブートローダーは既存のリージョン情報を使用せず、新しいリージョンレコードを生成する経路に入ります。
レコード識別用の固定マーカーであり、データの完全性を検証する署名やチェックサムではありません。
値を任意に変更すると、既存のリージョン情報が無効として扱われる可能性があるため、注意が必要です。

"""

help.TB522FU = """
リージョン（Region）レコードの開始位置を識別するためのマーカー（Magic Value）で、ASCII文字列 `deadbeef` が保存されます。
2つのリージョン識別値が両方とも一致した場合に限り、ブートローダーは保存されたリージョン情報を有効なデータと判断し、検証に使用します。
片方の識別値だけが一致する場合は、情報が破損していると判断して起動を拒否します。両方とも一致しない場合は、呼び出し時点の起動状態がgreenの場合に限り、リージョン情報を新規生成します。
レコード識別用の固定マーカーであり、データの完全性を検証する署名やチェックサムではありません。
値を任意に変更すると、既存のリージョン情報が無効として扱われる可能性があるため、注意が必要です。

"""

[region_info_version]
name = "リージョンレコードのバージョン"
help = """
リージョン（Region）レコードのデータ構造バージョンを表す値です。
正常なバージョン値は1で、ブートローダーはこれを基準にレコードの有効性を判断します。
値が2以上の場合、未対応のバージョンと判断し、バージョン不一致エラーとして扱います。
この値を任意に変更すると、リージョン情報が正しく認識されない可能性があるため、注意が必要です。

"""

[oem_reserved_1]
name = "OEM予約領域（用途未確認）"
help = """
論理DeviceInfo構造体に含まれる予約領域で、正確な用途は確認されていません。
この領域の個々のバイトが持つ機能や役割は確認されていません。
DeviceInfo構造体全体、またはリージョン（Region）レコード単位でデータを読み取り・保存する際に、まとめて処理されます。
独立した機能が確認されていなくても未使用領域とは断定できないため、値を任意に変更したり0に初期化したりすることは推奨しません。

"""

[region]
name = "リージョン"
help.TB520FU = """
デバイスのリージョン（Region）を表す3バイトの文字列で、`PRC` または `ROW` が保存されます。
起動中に、ブートローダーはこの値をファームウェアDTBのリージョン情報（`region_country`）と比較し、互換性を確認します。
2つの値が一致しない場合、「互換性のないシステム」という案内メッセージを表示し、起動を中止します。
この値はデバイスの国コードとは別に管理され、ファームウェアとのリージョン互換性を判断するために使用されます。
値を任意に変更すると、ファームウェアとのリージョン不一致によって正常に起動できなくなる可能性があります。

"""
help.TB522FU = """
デバイスのリージョン（Region）を表す3バイトの文字列で、`PRC` または `ROW` が保存されます。
起動中に、ブートローダーはこの値をファームウェアDTBのリージョン情報（`/product_region` ノードの `build_region` プロパティ）と比較し、互換性を確認します。
2つの値が一致しない場合、「互換性のないシステム」という案内メッセージを表示し、起動を中止します。
この値はデバイスの国コードとは別に管理され、ファームウェアとのリージョン互換性を判断するために使用されます。
値を任意に変更すると、ファームウェアとのリージョン不一致によって正常に起動できなくなる可能性があります。

"""

[region_fill]
name = "リージョン文字列のパディング領域"
help = """
16バイトのリージョン（Region）文字列領域のうち、実際のリージョン値を保存する先頭3バイトを除いた、残りの13バイトの領域です。
正常な状態では、この領域のすべてのバイトが0で埋められます。
リージョン文字列の余りを埋めるためのパディング（Padding）領域であり、別の国コードやリージョン情報を保存するフィールドではありません。
データ構造の一貫性を維持するため、値を任意に変更することは推奨しません。

"""

[region_magic_2]
name = "リージョンレコード識別値2（Magic）"
help.TB520FU = """
リージョン（Region）レコードの開始位置を識別するためのマーカー（Magic Value）で、ASCII文字列 `deadbeef` が保存されます。
2つのリージョン識別値が両方とも一致した場合に限り、ブートローダーは保存されたリージョン情報を有効なデータと判断し、検証に使用します。
どちらか一方でも識別値が一致しない場合、ブートローダーは既存のリージョン情報を使用せず、新しいリージョンレコードを生成する経路に入ります。
レコード識別用の固定マーカーであり、データの完全性を検証する署名やチェックサムではありません。
値を任意に変更すると、既存のリージョン情報が無効として扱われる可能性があるため、注意が必要です。

"""

help.TB522FU = """
リージョン（Region）レコードの開始位置を識別するためのマーカー（Magic Value）で、ASCII文字列 `deadbeef` が保存されます。
2つのリージョン識別値が両方とも一致した場合に限り、ブートローダーは保存されたリージョン情報を有効なデータと判断し、検証に使用します。
片方の識別値だけが一致する場合は、情報が破損していると判断して起動を拒否します。両方とも一致しない場合は、呼び出し時点の起動状態がgreenの場合に限り、リージョン情報を新規生成します。
レコード識別用の固定マーカーであり、データの完全性を検証する署名やチェックサムではありません。
値を任意に変更すると、既存のリージョン情報が無効として扱われる可能性があるため、注意が必要です。

"""

[region_reserved]
name = "リージョンレコード予約領域（用途未確認）"
help = """
論理DeviceInfo構造体のリージョン（Region）レコード末尾にある予約領域で、正確な用途は確認されていません。
この領域の個々のバイトが持つ機能や役割は確認されていません。
DeviceInfo構造体全体、またはリージョンレコード単位でデータを読み取り・保存する際に、まとめて処理されます。
独立した機能が確認されていなくても未使用領域とは断定できないため、値を任意に変更したり0に初期化したりすることは推奨しません。

"""

[region_padding]
name = "リージョンデータのパディング領域（用途未確認）"
