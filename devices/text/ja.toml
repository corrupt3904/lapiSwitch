（確定）

"""

[fdr_frs_uds_flag]
name = "FDR/FRS-UDS 状態"
help = """
工場出荷時リセット（FDR）後にセキュリティの秘密値を新しく作るよう要求するフラグです。
特定の初期化要求（--reason=MainClearConfirm）を検出すると 1 に設定され、キャッシュが空になります。
次の FRS/UDS 処理で Keymint が新しい秘密値を作り、ブートローダーが 0 に戻します。
ブートローダーはちょうど 1 のときだけ消すため、2 以上が残ると再生成が繰り返されることがあります。
userdata を直接消すことはありませんが、セキュリティ鍵の導出に関わる値です。
IPC ログの設定ではありません。
（確定）

"""

[reserved_0CA1]
name = "アライメント用／予約領域"
help = """
