DeviceInfo構造体全体、またはリージョンレコード単位でデータを読み取り・保存する際に、まとめて処理されます。
パディング（Padding）領域に分類されていますが、実際にメモリアラインメントだけを目的とする領域かどうかは確認されていません。
未使用領域とは断定できないため、値を任意に変更したり0に初期化したりすることは推奨しません。

"""

