[golden_snapshot]
name = "golden snapshot（推定）"
help = """
定数 0x575757 と比較される 8 バイトの値です。
0/1 の設定ではないため、1 を入れても「真」にはなりません。
名前は外部の構造体に由来するもので、公式名称は確認されていません。
分析した 2 つのブートローダーでは関連する表示経路（Erase swap on restore）が無効で、実際のスナップショット復元や swap 削除の機能は確認されていません。
（一部確認）

"""

[audio_framework]
name = "オーディオフレームワークのバッファー"
help = """
起動時に androidboot.audio=<名前> として渡すオーディオフレームワーク名です。
許可される名前は audioreach、elite、awe で、大文字と小文字を区別します。
