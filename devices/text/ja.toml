[fastboot_mode]
name = "Fastbootホットキーによる起動の制限"
help.TB520FU = """
0 = 許可
1 = ブロック

電源投入時に、特定のキーの組み合わせ（ホットキー）によるFastbootモードへの移行を許可またはブロックするフラグです。
値が0の場合、ホットキーによるFastbootモードへの移行が許可されます。
値が1の場合、ホットキーによるFastbootモードへの移行がブロックされます。
現在Fastbootモードに入っているかどうかを表す値でも、次回の起動先をFastbootモードに指定する設定でもありません。
再起動コマンドなど、ほかの経路によるFastbootモードへの移行には影響しません。

"""
help.TB522FU = """
